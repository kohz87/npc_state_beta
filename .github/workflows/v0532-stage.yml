name: Stage v0.5.32

on:
  push:
    branches:
      - fix/v0532-first-contact-completion
    paths:
      - .github/workflows/v0532-stage.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply candidate patch
        run: |
          python3 scripts/v0532_stage.py
          python3 scripts/v0532_fix.py
      - name: Validate
        run: npm run validate
      - name: Test
        run: npm test
      - name: Package
        run: npm run package
      - name: Measure prompts
        run: npm run measure:scan-prompts
      - name: Diff check
        run: git diff --check
      - name: Commit candidate tree
        run: |
          rm scripts/v0532_stage.py scripts/v0532_fix.py .github/workflows/v0532-stage.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: complete newly admitted dossiers in v0.5.32'
          git push origin HEAD:fix/v0532-first-contact-completion
          echo 'v0.5.32 candidate committed after graph assertion correction'
