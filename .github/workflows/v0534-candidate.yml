              const raw = visible + ' <Blocks><World_State>NPCs Present: Linnea Rost | bleached linen sleeves | G1</World_State><Inventory>Provisional Guild Token | G1</Inventory></Blocks>';
              const ex = exchange(raw);
              const patch = {
                  ...basePatch(),
                  identityEvidence: { anchor: 'Linnea Rost', excerpts: ['Linnea Rost wears a grey wool vest and rolled linen sleeves.'], explanation: 'Visible identity.' },
                  activityEvidence: { exchangeActive: { excerpts: ['Linnea seals Lucien Noctis’s completed provisional registration and hands the form back.'], explanation: 'Direct registration action.' }, inChat: { excerpts: ['Linnea Rost wears a grey wool vest and rolled linen sleeves.'], explanation: 'Current scene.' } },
                  appearance: 'Bleached linen sleeves.',
                  memories: ['Lucien completed G1 registration.'],
                  semanticUpdates: [{ field: 'role', operation: 'establish', value: 'Guild clerk', durability: 'durable', sources: [{ messageId: 1, excerpt: 'Linnea Rost wears a grey wool vest and rolled linen sleeves.' }], explanation: 'Visible current clerk context.' }],
              };
              const result = applyScanResult(safeState('chat:v0534-flat-firewall'), payload(patch), options(ex));
              const npc = result.state.npcs.find(row => row.name === 'Linnea Rost');
              assert.equal(npc.appearance, '');
              assert.deepEqual(npc.memories, []);
              assert.equal(result.semanticDiagnostics.some(row => row.channel === 'direct-field' && row.field === 'appearance' && row.reason === 'semantic-source-evidence-required'), true);
              assert.equal(result.semanticDiagnostics.some(row => row.channel === 'direct-field' && row.field === 'memories' && row.reason === 'semantic-source-evidence-required'), true);
          });

          test('NEW and EXISTING use the same field-scoped source firewall while supported registration memory survives', () => {
              const visibleAppearance = 'Linnea Rost wears a grey wool vest and rolled linen sleeves.';
              const registration = 'Linnea seals Lucien Noctis’s completed provisional registration and hands the form back.';
              const world = 'NPCs Present: Linnea Rost | bleached linen sleeves | G1';
              const raw = [visibleAppearance, registration, `<Blocks><World_State>${world}</World_State><Inventory>Provisional Guild Token | G1</Inventory></Blocks>`].join(' ');
              const ex = exchange(raw);
              const invalidAppearance = { field: 'appearance', operation: 'establish', value: 'Bleached linen sleeves.', durability: 'durable', sources: [{ messageId: 1, excerpt: world }], explanation: 'Structured-only appearance must not authorize durable appearance.' };
              const validMemory = { field: 'memories', operation: 'establish', value: ['Processed Lucien Noctis’s completed provisional registration.'], durability: 'durable', sources: [{ messageId: 1, excerpt: registration }], explanation: 'Visible completed registration is a durable event.' };

              const newResult = applyScanResult(safeState('chat:v0534-source-new'), payload(basePatch({ semanticUpdates: [invalidAppearance, validMemory] })), options(ex));
              const fresh = newResult.state.npcs.find(row => row.name === 'Linnea Rost');
              assert.equal(fresh.appearance, '');
              assert.deepEqual(fresh.memories, ['Processed Lucien Noctis’s completed provisional registration.']);
              assert.equal(fresh.age, '');
              assert.equal(fresh.apparentAge, '');
              assert.equal(newResult.semanticDiagnostics.some(row => row.field === 'appearance' && row.status === 'invalid-source-reference'), true);

              const existingState = safeState('chat:v0534-source-existing');
              existingState.npcs = [normalizeNpc({ id: 'linnea', name: 'Linnea Rost' })];
              const existingPatch = basePatch({ id: 'linnea', semanticUpdates: [invalidAppearance, validMemory] });
              const existingResult = applyScanResult(existingState, payload(existingPatch), options(ex));
              assert.equal(existingResult.state.npcs[0].appearance, '');
              assert.deepEqual(existingResult.state.npcs[0].memories, ['Processed Lucien Noctis’s completed provisional registration.']);
              assert.equal(existingResult.semanticDiagnostics.some(row => row.field === 'appearance' && row.status === 'invalid-source-reference'), true);
          });

          test('grounded explicit birthday wins before passive generated birthday fill and actual/apparent age remain separate', () => {
              const birthdayLine = 'Linnea Rost says, \"My birthday is 12 Frost.\"';
              const ex = exchange([IDENTITY, birthdayLine].join(' '));
              const result = applyScanResult(safeState('chat:v0534-birthday'), payload(basePatch({
                  semanticUpdates: [{ field: 'birthday', operation: 'establish', value: '12 Frost', durability: 'durable', sources: [{ messageId: 1, excerpt: birthdayLine }], explanation: 'Explicit birthday statement.' }],
              })), { ...options(ex), birthdayFill: { mode: 'random', calendar: 'Frost:30\nThaw:30', fallbackDays: 30 } });
              const npc = result.state.npcs.find(row => row.name === 'Linnea Rost');
              assert.equal(npc.birthday, '12 Frost');
              assert.equal(npc.birthdayProvenance, 'explicit');
              assert.equal(npc.age, '');
              assert.equal(npc.apparentAge, '');
          });
