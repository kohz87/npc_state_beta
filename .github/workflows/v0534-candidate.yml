name: v0534 candidate

on:
  push:
    branches:
      - work/v0534-focused-fixes
    paths:
      - .github/workflows/v0534-candidate.yml

permissions:
  contents: write

jobs:
  build-candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/v0534-focused-fixes
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Trace affected references
        run: |
          printf '%s\n' '--- scan-application bootstrap/source helpers ---'
          grep -nE 'applyIdentityAndBootstrapPatch|bootstrapBirthdayGrounded|recordBootstrapDiagnostics|dossierField(Group|ValueIssue)|normalizeActualAge|normalizeApparentAge|normalizeAppearanceForms|normalizeBirthday|normalizeCurrentStatus|normalizeMemoryEntries' src/scan-application.js || true
          printf '%s\n' '--- model role/bootstrap compatibility ---'
          grep -R -nE '_modelLedRole|restoreNewNpcModelLedRole|prepareModelLedPayload' src tests || true
          printf '%s\n' '--- relationship target binding ---'
          grep -R -nE 'worldStateCanonicalEnrichmentAccepted|relationshipSummaryTargetBinding' src tests || true
      - name: Apply focused patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text()

          def write(path, text):
              Path(path).write_text(text)

          def replace(path, old, new, count=1):
              text = read(path)
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f'{path}: expected {count} occurrences, found {actual}: {old[:100]!r}')
              write(path, text.replace(old, new, count))

          def sub(path, pattern, replacement, count=1, flags=re.S):
              text = read(path)
              text2, n = re.subn(pattern, replacement, text, count=count, flags=flags)
              if n != count:
                  raise SystemExit(f'{path}: expected regex count {count}, found {n}: {pattern[:120]!r}')
              write(path, text2)

          # 1. Current Dynamic: one canonical accepted identity/activity bridge.
          relationship_fn = r'''function relationshipSummaryContextualTargetBound\(npc, excerpts, excerptMatches, options = \{\}\) \{.*?\n\}\n\nfunction relationshipSummaryEvidenceGrounded'''
          relationship_repl = r'''function relationshipSummaryContextualTargetBound(npc, excerpts, excerptMatches, options = {}) {
              const binding = options.relationshipSummaryTargetBinding;
              if (!binding || typeof binding !== 'object' || Array.isArray(binding)) return false;
              if (String(binding.npcId || '') !== String(npc?.id || '')) return false;
              if (binding.identityAccepted !== true || binding.identityEvidenceAccepted !== true
                  || binding.exchangeActiveAccepted !== true || binding.activityEvidenceAccepted !== true) return false;

              const subjectNames = [npc?.name, ...(Array.isArray(npc?.aliases) ? npc.aliases : [])].map(value => String(value || '').trim()).filter(Boolean);
              const playerName = String(options.playerName || '').trim();
              const otherNpcNames = (Array.isArray(options.otherNpcNames) ? options.otherNpcNames : []).map(value => String(value || '').trim()).filter(Boolean);
              if (!subjectNames.length || !playerName) return false;

              const acceptedActivityExcerpts = Array.isArray(binding.activityEvidenceExcerpts) ? binding.activityEvidenceExcerpts : [];
              const acceptedIdentityExcerpts = Array.isArray(binding.identityEvidenceExcerpts) ? binding.identityEvidenceExcerpts : [];
              const sources = relationshipEvidenceSourcesForOptions(options);
              const activityBindings = verifiedTransientEvidenceBindings(binding.activityEvidenceBindings, acceptedActivityExcerpts, sources);
              const identityBindings = verifiedTransientEvidenceBindings(binding.identityEvidenceBindings, acceptedIdentityExcerpts, sources);
              if (!activityBindings.length || !identityBindings.length) return false;

              const activitySources = new Set(activityBindings.filter(row => row.kind === 'visible').map(row => row.sourceId));
              const identitySources = new Set(identityBindings.filter(row => row.kind === 'visible').map(row => row.sourceId));
              const boundSources = new Set([...activitySources].filter(sourceId => identitySources.has(sourceId)));
              if (!boundSources.size) return false;

              const playerBoundActivitySources = new Set(activityBindings.filter(row => row.kind === 'visible'
                  && !identityMentioned(row.excerpt, otherNpcNames, subjectNames)
                  && playerMentioned(row.excerpt, playerName, [...subjectNames, ...otherNpcNames], {
                      allowNarratorSecondPerson: row.insideQuotedDialogue !== true,
                      sourceRole: row.sourceRole || '',
                  }))
                  .map(row => row.sourceId));

              const summarySourceSafe = sourceId => excerpts.every((excerpt, index) =>
                  excerptMatches[index]?.sourceId === sourceId
                  && !explicitOtherNpcTarget(excerpt, subjectNames, playerName, otherNpcNames, excerptMatches[index])
                  && !contextualDialogueNarrationAmbiguous(
                      excerpt,
                      subjectNames,
                      playerName,
                      otherNpcNames,
                      acceptedActivityExcerpts,
                      acceptedIdentityExcerpts,
                      excerptMatches[index]?.sourceRole || '',
                  ));
              const summaryReusesAcceptedBinding = sourceId => excerpts.some((excerpt, index) =>
                  excerptMatches[index]?.sourceId === sourceId
                  && (summaryExcerptOverlapsAcceptedActivity(excerpt, acceptedActivityExcerpts)
                      || summaryExcerptOverlapsAcceptedActivity(excerpt, acceptedIdentityExcerpts)));

              // Accepted identity + exchange activity supplies transient participant binding only
              // inside one exactly matched current source. At least one summary excerpt must reuse
              // that accepted evidence unless the accepted activity itself directly binds the PC.
              // This does not grant authority to arbitrary same-message dialogue or another target.
              return [...boundSources].some(sourceId => summarySourceSafe(sourceId)
                  && (summaryReusesAcceptedBinding(sourceId) || playerBoundActivitySources.has(sourceId)));
          }

          function relationshipSummaryEvidenceGrounded'''
          sub('src/scan-relationships.js', relationship_fn, relationship_repl)

          # 2. Deterministic core: identity only. Ordinary NEW fields no longer have a flat bypass.
          bootstrap_block = r'''const BIRTHDAY_EVIDENCE_CUES = .*?\nfunction socialEdgeKey'''
          identity_only = r'''function applyIdentityPatch(npc, patch) {
              const locked = new Set(npc.manualProfileFields || []);
              const next = structuredClone(npc);
              const canonicalName = canonicalPatchName(patch);

              if (!locked.has('name') && canonicalName) {
                  if (canonicalName !== next.name && next.name && !isTechnicalNpcIdentity(next.name)) {
                      next.aliases = appendUnique(next.aliases, [next.name], 10);
                  }
                  next.name = canonicalName;
              }
              if (!locked.has('aliases')) {
                  const aliases = (Array.isArray(patch?.aliases) ? patch.aliases : [])
                      .filter(alias => humanIdentityCandidate(alias, patch?.role));
                  next.aliases = appendUnique(next.aliases, aliases, 10);
              }
              return next;
          }

          function socialEdgeKey'''
          sub('src/scan-application.js', bootstrap_block, identity_only)
          replace('src/scan-application.js',
                  "npc = applyIdentityAndBootstrapPatch(npc, patch, { playerName, dossierLimits, isBootstrap: createdNpcIds.has(npc.id), profileContext: String(options.profileContext || ''), applicationDiagnostics });",
                  "npc = applyIdentityPatch(npc, patch);")
          replace('src/scan-application.js',
                  "                    const canonicalIdentity = canonicalPatchName(patch, []);\n                    const worldStateCanonicalEnrichmentAccepted = Boolean(identityEvidenceAccepted\n                        && canonicalIdentity\n                        && !containsNormalizedPhrase(currentVisibleText, canonicalIdentity)\n                        && worldStateCanonicalIdentityMention(patch, evidencePolicy));\n",
                  "")
          replace('src/scan-application.js',
                  "                        worldStateCanonicalEnrichmentAccepted,\n",
                  "")
          replace('src/scan-application.js',
                  "    if (options.birthdayFill && birthdayFillIds.size) {\n        state.npcs = state.npcs.map(raw => birthdayFillIds.has(raw.id)\n            ? normalizeNpc(applyBirthdayFill(raw, options.birthdayFill))\n            : raw);\n    }",
                  "    if (options.deferBirthdayFill !== true && options.birthdayFill && birthdayFillIds.size) {\n        state.npcs = state.npcs.map(raw => birthdayFillIds.has(raw.id)\n            ? normalizeNpc(applyBirthdayFill(raw, options.birthdayFill))\n            : raw);\n    }")
          replace('src/scan-application.js',
                  "        applicationDiagnostics: applicationDiagnostics.map(row => structuredClone(row)),\n",
                  "        applicationDiagnostics: applicationDiagnostics.map(row => structuredClone(row)),\n        birthdayFillNpcIds: [...birthdayFillIds],\n")
          # Remove imports that belonged only to the superseded flat bootstrap path.
          replace('src/scan-application.js',
                  "import { DOSSIER_SEMANTIC_FIELDS, dossierFieldGroup, dossierFieldValueIssue, normalizeDossierTextCollection } from './model/dossier-fields.js';\n",
                  "")
          replace('src/scan-application.js',
                  "import { DEFAULT_RELATIONSHIP_CAPS, RELATIONSHIP_AXES, applyBirthdayFill, findNpcByReference, makeNpcId, normalizeActualAge, normalizeApparentAge, normalizeAppearanceForms, normalizeBirthday, normalizeCurrentStatus, normalizeDossierLimits, normalizeFamilySlots, normalizeKeyRelationshipEntries, normalizeMemoryEntries, normalizeName, normalizeNpc, normalizeNpcAdmissionMode, normalizeState } from './schema.js';",
                  "import { DEFAULT_RELATIONSHIP_CAPS, RELATIONSHIP_AXES, applyBirthdayFill, findNpcByReference, makeNpcId, normalizeDossierLimits, normalizeFamilySlots, normalizeKeyRelationshipEntries, normalizeName, normalizeNpc, normalizeNpcAdmissionMode, normalizeState } from './schema.js';")

          # 3. Boundary adapter no longer grants a special direct NEW-role authority.
          replace('src/model/legacy-semantic-adapter.js',
                  "    const admissionMode = String(options.admissionMode || '').trim();\n\n",
                  "")
          sub('src/model/legacy-semantic-adapter.js',
              r'''        const identityKind = String\(patch\?\.identityKind \|\| ''\)\.trim\(\)\.toLocaleLowerCase\(\)\.replace\(/\[_ \]\+/g, '-'\);\n        if \(!existing && admissionMode === 'named_preferred' && \['named', 'proper-name', 'proper'\]\.includes\(identityKind\)\) \{.*?\n        \}\n        if \(!existing\) continue;''',
              "        if (!existing) continue;")

          # 4. Canonical semantic path now owns NEW and EXISTING ordinary fields.
          replace('src/model/semantic-updates.js',
                  "const PROFILE_EVOLUTION_FIELDS = new Set(['personality', 'behaviorProfile', 'speech', 'mannerisms']);\n",
                  "const PROFILE_EVOLUTION_FIELDS = new Set(['personality', 'behaviorProfile', 'speech', 'mannerisms']);\nconst PROFILE_BASES = new Set(['explicit', 'reinforced', 'development']);\n")
          replace('src/model/semantic-updates.js',
                  "export const NPC_STATE_MODEL_CONTRACT_VERSION = 6;",
                  "export const NPC_STATE_MODEL_CONTRACT_VERSION = 7;")
          replace('src/model/semantic-updates.js',
                  "        `Mode: ${mode}. EXISTING dossiers have ONE ordinary mutation channel: semanticUpdates; do not also emit legacy/direct ordinary replacements. Semantic fields: ${dossierSemanticFieldList()}. Operations: ${DOSSIER_SEMANTIC_OPERATIONS.join('|')}.`,",
                  "        `Mode: ${mode}. NEW and EXISTING dossiers have ONE ordinary mutation channel: semanticUpdates after identity/admission; direct ordinary fields are not mutation authority. Semantic fields: ${dossierSemanticFieldList()}. Operations: ${DOSSIER_SEMANTIC_OPERATIONS.join('|')}.`,")
          replace('src/model/semantic-updates.js',
                  "        `Coverage: every exchange-active EXISTING NPC inspects groups [${groups}]; targeted Refresh inspects all supplied groups. Proposed fields use semanticUpdates; otherwise list fieldEvaluations unchanged|insufficient|unavailable. Group labels alone are not field coverage.`,",
                  "        `Coverage: every exchange-active NEW/EXISTING NPC inspects groups [${groups}]; targeted Refresh inspects all supplied groups. Proposed fields use semanticUpdates; otherwise list fieldEvaluations unchanged|insufficient|unavailable. Group labels alone are not field coverage.`,")
          replace('src/model/semantic-updates.js',
                  "        'Update:{field,operation,value?,changes?,clear?,durability?,scope?,ageKind?,sources:[{messageId,excerpt}],explanation?}. Shape notation is explanatory. Omission preserves; remove is explicit; clear:true authorizes an empty collection. Age replacement needs ageKind birthday|elapsed|correction.',",
                  "        'Update:{field,operation,value?,changes?,clear?,durability?,scope?,ageKind?,profileBasis?,sources:[{messageId,excerpt}],explanation?}. profileBasis applies only to personality|behaviorProfile|speech|mannerisms. Omission preserves; remove is explicit; clear:true authorizes an empty collection. Age replacement needs ageKind birthday|elapsed|correction.',")
          replace('src/model/semantic-updates.js',
                  "        'Durable canon/profile needs durable evidence. Temporary sleep, silence, mood, injury, one-off action/pose, or temporary form does not become durable characterization; later grounded characterization may replace an obsolete temporary placeholder.',",
                  "        'Profile establishment is model-led: profileBasis=explicit when the source directly states a recurring trait/habit, reinforced when one owned source contains reinforcing instances, development only when changing an already established characteristic. One isolated action/pose stays profileObservations. The validator checks source/target/structure, not semantic recurrence or quote counts.',")
          replace('src/model/semantic-updates.js',
                  "        'Actual age is chronological: established replacement needs ageKind birthday|elapsed|correction plus evidence for the resulting number; never derive it from apparent age or invented calendar arithmetic. Birthday is passive freeform calendar metadata: preserve fantasy calendars, do not infer it from age, and do not auto-advance age merely because the date passes.',",
                  "        'Source authority is field-scoped. Split independently sourced facts into separate semanticUpdates; one disallowed source rejects only that proposal and never broadens structured authority. Actual age is chronological: established replacement needs ageKind birthday|elapsed|correction plus evidence for the resulting number; never derive it from apparent age or invented calendar arithmetic. Birthday is passive freeform calendar metadata.',")
          replace('src/model/semantic-updates.js',
                  "function profileEvolutionMode(update) {\n    if (Array.isArray(update?.changes) && update.changes.length > 1) return 'batch';",
                  "function profileEvolutionMode(update) {\n    if (PROFILE_BASES.has(String(update?.profileBasis || '').trim())) return String(update.profileBasis).trim();\n    if (Array.isArray(update?.changes) && update.changes.length > 1) return 'batch';")
          replace('src/model/semantic-updates.js',
                  "function semanticValueShapeIssue(update) {\n    const field = update?.field;\n    if (!field) return 'unsupported-field';",
                  "function semanticValueShapeIssue(update) {\n    const field = update?.field;\n    if (!field) return 'unsupported-field';\n    if (update.profileBasis !== undefined) {\n        const basis = String(update.profileBasis || '').trim().toLocaleLowerCase();\n        if (!PROFILE_EVOLUTION_FIELDS.has(field)) return 'profileBasis-unsupported-field';\n        if (!PROFILE_BASES.has(basis)) return 'profileBasis-invalid';\n    }")
          replace('src/model/semantic-updates.js',
                  "        durability: String(raw.durability || '').trim().toLocaleLowerCase(),\n",
                  "        durability: String(raw.durability || '').trim().toLocaleLowerCase(),\n        ...(raw.profileBasis !== undefined ? { profileBasis: String(raw.profileBasis || '').trim().toLocaleLowerCase() } : {}),\n")
          replace('src/model/semantic-updates.js',
                  "        durability: String(raw.durability || '').trim().toLocaleLowerCase(),\n        sources: sourceRows(raw).map(row => ({ messageId: row.messageId ?? null, excerpt: evidenceKey(row.excerpt, 900) })),",
                  "        durability: String(raw.durability || '').trim().toLocaleLowerCase(),\n        profileBasis: String(raw.profileBasis || '').trim().toLocaleLowerCase(),\n        sources: sourceRows(raw).map(row => ({ messageId: row.messageId ?? null, excerpt: evidenceKey(row.excerpt, 900) })),")
          # NEW deterministic copy gets identity only, regardless of whether a semantic proposal exists.
          sub('src/model/semantic-updates.js',
              r'''export function prepareModelLedPayload\(stateInput, resultInput, admissionMode = 'balanced'\) \{.*?\n\}\n\nfunction patchResolutionAt''',
              r'''export function prepareModelLedPayload(stateInput, resultInput) {
              if (!resultInput || typeof resultInput !== 'object' || Array.isArray(resultInput)) return resultInput;
              const result = structuredClone(resultInput);
              const state = stateInput || {};
              for (const patch of Array.isArray(result.npcs) ? result.npcs : []) {
                  const byId = String(patch.id || '').trim() ? (state.npcs || []).find(npc => npc.id === String(patch.id).trim()) : null;
                  const existing = byId || findNpcByReference(state, patch.name || '');
                  // Identity/admission is focused deterministic state. Ordinary NEW values are
                  // applied later from the original result through the same semantic validator
                  // used for existing dossiers, so flat compatibility values cannot bypass it.
                  for (const field of DOSSIER_SEMANTIC_FIELDS) delete patch[field];
                  delete patch._modelLedRole;
                  if (!existing) continue;
                  delete patch.profileChanges;
                  delete patch.canonChanges;
                  delete patch.ageChange;
                  delete patch.ageProgression;
                  delete patch.appearanceFormChanges;
                  delete patch.keyRelationshipChanges;
              }
              return result;
          }

          function patchResolutionAt''')
          # Remove superseded special NEW-role restorer.
          sub('src/model/semantic-updates.js',
              r'''function restoreNewNpcModelLedRole\(state, originalResult, options = \{\}, diagnostics = \[\]\) \{.*?\n\}\n\nfunction identityValue''',
              "function identityValue")
          replace('src/model/semantic-updates.js',
                  "    restoreNewNpcModelLedRole(state, resultInput, options, diagnostics);\n\n",
                  "")
          # Only semanticUpdates count as ordinary field proposals/coverage.
          sub('src/model/semantic-updates.js',
              r'''function proposedFieldsForPatch\(patch = \{\}\) \{.*?\n\}\n\nconst FIELD_EVALUATION_STATES''',
              r'''function proposedFieldsForPatch(patch = {}) {
              const fields = [];
              for (const update of Array.isArray(patch?.semanticUpdates) ? patch.semanticUpdates : []) {
                  const field = String(update?.field || '').trim();
                  if (FIELD_SET.has(field) && !fields.includes(field) && fields.length < 32) fields.push(field);
              }
              return fields;
          }

          const FIELD_EVALUATION_STATES''')
          # Basis requirement is structural/provenance policy only; no recurrence regex/counting.
          insert_after = "function normalizeCollection(field, values, limits, playerName = '') {\n    if (field === 'keyRelationships') {\n        return normalizeKeyRelationshipEntries(values, limits.keyRelationships, 500)\n            .filter(value => !playerReference(value, playerName));\n    }\n    if (field === 'memories') return normalizeMemoryEntries(values, limits.memories, 700);\n    const cap = field === 'behaviorProfile' ? limits.behaviorProfile : limits.mannerisms;\n    return normalizeDossierTextCollection(field, values, cap, 700);\n}\n"
          basis_helper = insert_after + "\nfunction profileEstablishmentBasisIssue(npc, update, limits, playerName = '') {\n    if (!PROFILE_EVOLUTION_FIELDS.has(update.field) || update.operation === 'remove') return '';\n    const established = SCALAR_FIELDS.has(update.field)\n        ? Boolean(normalizedScalar(update.field, npc?.[update.field]))\n        : (COLLECTION_FIELDS.has(update.field) ? collectionValues(npc, update.field, limits, playerName).length > 0 : true);\n    if (established) return '';\n    const basis = String(update.profileBasis || '').trim().toLocaleLowerCase();\n    if (!basis) return 'missing-profile-establishment-basis';\n    if (basis === 'development') return 'profile-development-requires-established-characteristic';\n    return '';\n}\n"
          replace('src/model/semantic-updates.js', insert_after, basis_helper)
          replace('src/model/semantic-updates.js',
                  "            const provenance = sourceValidation(update, options);\n            if (!provenance.ok) {\n                diagnostics.push({ npcId: npc.id, field: update.field, operation: update.operation, group: dossierFieldGroup(update.field), status: 'invalid-source-reference', reason: provenance.reason });\n                continue;\n            }\n            let result;",
                  "            const provenance = sourceValidation(update, options);\n            if (!provenance.ok) {\n                diagnostics.push({ npcId: npc.id, field: update.field, operation: update.operation, group: dossierFieldGroup(update.field), status: 'invalid-source-reference', reason: provenance.reason });\n                continue;\n            }\n            const profileBasisIssue = profileEstablishmentBasisIssue(npc, update, limits, options.playerName);\n            if (profileBasisIssue) {\n                diagnostics.push({ npcId: npc.id, field: update.field, operation: update.operation, group: dossierFieldGroup(update.field), status: 'rejected-proposal', reason: profileBasisIssue });\n                continue;\n            }\n            let result;")
          # Explicitly diagnose ignored direct NEW ordinary proposals.
          replace('src/model/semantic-updates.js',
                  "    const limits = normalizeDossierLimits(options.dossierLimits);\n\n    const patches = Array.isArray(resultInput?.npcs) ? resultInput.npcs : [];",
                  "    const limits = normalizeDossierLimits(options.dossierLimits);\n    const newlyAdmittedNpcIds = new Set(Array.isArray(options.newlyAdmittedNpcIds) ? options.newlyAdmittedNpcIds : []);\n\n    const patches = Array.isArray(resultInput?.npcs) ? resultInput.npcs : [];")
          replace('src/model/semantic-updates.js',
                  "        const ordinaryProposalFields = proposedFieldsForPatch(patch);\n        const semanticRows = Array.isArray(patch.semanticUpdates) ? patch.semanticUpdates : [];",
                  "        const ordinaryProposalFields = proposedFieldsForPatch(patch);\n        const semanticRows = Array.isArray(patch.semanticUpdates) ? patch.semanticUpdates : [];\n        if (newlyAdmittedNpcIds.has(npc.id)) {\n            const semanticFields = new Set(semanticRows.map(row => String(row?.field || '').trim()));\n            for (const field of DOSSIER_SEMANTIC_FIELDS) {\n                if (!directFieldProposed(patch, field) || semanticFields.has(field)) continue;\n                diagnostics.push({ npcId: npc.id, patchIndex, field, group: dossierFieldGroup(field), channel: 'direct-field', status: 'rejected-proposal', reason: 'semantic-source-evidence-required' });\n            }\n        }")

          # 5. Schema retains richer basis provenance in the existing bounded evidence store.
          replace('src/schema.js',
                  "    const allowedModes = new Set(['refine', 'gradual', 'explicit', 'batch']);",
                  "    const allowedModes = new Set(['refine', 'gradual', 'explicit', 'reinforced', 'development', 'batch']);")

          # 6. Scanner coordinates NEW semantic ownership and explicit birthday precedence.
          replace('src/scanner.js',
                  "import { findNpcByReference, normalizeNpcAdmissionMode, normalizeRelationshipSummary } from './schema.js';",
                  "import { applyBirthdayFill, findNpcByReference, normalizeNpc, normalizeNpcAdmissionMode, normalizeRelationshipSummary } from './schema.js';")
          replace('src/scanner.js',
                  "    const adapted = adaptLegacySemanticPayload(stateInput, focused.result, { ...semanticOptions, compatibilityDiagnostics });\n    const prepared = prepareModelLedPayload(stateInput, adapted, options.admissionMode);\n    const applied = core.applyScanResult(stateInput, prepared, options);",
                  "    const adapted = adaptLegacySemanticPayload(stateInput, focused.result, { ...semanticOptions, compatibilityDiagnostics });\n    const prepared = prepareModelLedPayload(stateInput, adapted);\n    const preexistingNpcIds = new Set((stateInput?.npcs || []).map(npc => npc.id));\n    const applied = core.applyScanResult(stateInput, prepared, { ...options, deferBirthdayFill: true });\n    const newlyAdmittedNpcIds = applied.patchResolutions\n        .filter(row => row?.status === 'accepted' && row.npcId && !preexistingNpcIds.has(row.npcId))\n        .map(row => row.npcId);")
          replace('src/scanner.js',
                  "    const semantic = applyModelLedSemanticUpdates(observations.state, adapted, {\n        ...semanticOptions,\n        patchResolutions: applied.patchResolutions,\n    });\n    const family = applyModelLedFamilyFacts(semantic.state, adapted, options);",
                  "    const semantic = applyModelLedSemanticUpdates(observations.state, adapted, {\n        ...semanticOptions,\n        patchResolutions: applied.patchResolutions,\n        newlyAdmittedNpcIds,\n    });\n    const family = applyModelLedFamilyFacts(semantic.state, adapted, options);\n    if (options.birthdayFill && Array.isArray(applied.birthdayFillNpcIds)) {\n        const birthdayFillIds = new Set(applied.birthdayFillNpcIds);\n        family.state.npcs = family.state.npcs.map(raw => birthdayFillIds.has(raw.id)\n            ? normalizeNpc(applyBirthdayFill(raw, options.birthdayFill))\n            : raw);\n    }")

          # 7. Compact model instructions: one semantic path, model-led basis, no duplicate rule stack.
          replace('src/scan-helpers.js',
                  "    if (includeNew) modes.push('NEW: capture supported facts only; unknown is valid');",
                  "    if (includeNew) modes.push('NEW: establish supported ordinary facts through semanticUpdates; unknown is valid');")
          replace('src/scan-helpers.js',
                  "        'FIRST-PASS SUFFICIENCY: One scene can contain multiple distinct observations supporting a narrow initial field; repeated encounters are not required. It remains ONE owned source for later development, not multiple independent events.',\n        'BEHAVIOR PROFILE EVIDENCE: personality may be established narrowly from multiple reinforcing choices/reactions. behaviorProfile needs explicit recurrence/generalization or multiple reinforcing actions. Multiple related instances may consolidate into one narrow mannerism; one isolated gesture, mood, pose, line, or object action must not be rewritten as a habitual behavior and stays observation evidence.',",
                  "        'FIRST-PASS PROFILE: One source may establish a narrow characteristic when it explicitly states recurrence/trait meaning or contains reinforcing instances; use semanticUpdates with profileBasis explicit|reinforced. One isolated gesture, pose, line, mood, or object action stays profileObservations. Quote/message counts never decide recurrence.',")
          replace('src/scan-helpers.js',
                  "        'PROFILE DEVELOPMENT: refine compatible detail. Lasting change needs explicit sustained development or independent observations plus new support; elapsed time or temporary mood/sleep/injury/stress/silence is insufficient. Player-specific attitude belongs in Current Dynamic.',",
                  "        'PROFILE DEVELOPMENT: use profileBasis=development only for an established characteristic with grounded lasting change; independent observations still need new support. Elapsed time or temporary mood/sleep/injury/stress/silence is insufficient. Player-specific attitude belongs in Current Dynamic.',")

          replace('src/scan-prompts.js',
                  "        'Important Memories are distinct durable events/facts; refine richer evidence of the same event instead of appending paraphrases. keyRelationships contains significant NON-PLAYER ties from this NPC perspective; familyFacts/socialEdges complement it. NEW NPCs may bootstrap concise grounded arrays within limits.',",
                  "        'Important Memories are distinct durable events/facts; refine richer evidence of the same event instead of appending paraphrases. keyRelationships contains significant NON-PLAYER ties from this NPC perspective; familyFacts/socialEdges complement it. NEW and EXISTING arrays use semanticUpdates within these limits.',")
          replace('src/scan-prompts.js',
                  "        '- Cover every individually relevant NPC, including multiple new/existing characters. Every exchange-active EXISTING NPC needs an npcs patch for explicit relationship/field evaluation; named-only mentions, crowds, background workers, and incidental characters do not become new dossiers.',",
