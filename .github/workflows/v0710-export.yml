name: v0710 source export

on:
  push:
    branches: [automation/v0710-work]

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Archive exact checkout
        run: |
          zip -qr /tmp/npc-state-v0710-source.zip . -x '.git/*' 'dist/*'
      - uses: actions/upload-artifact@v4
        with:
          name: npc-state-v0710-source
          path: /tmp/npc-state-v0710-source.zip
          if-no-files-found: error
