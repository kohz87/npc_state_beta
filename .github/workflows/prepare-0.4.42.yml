name: Prepare NPC State 0.4.42 Workflow

on:
  push:
    branches:
      - feat/v0.4.42-scan-profiles-completeness
    paths:
      - 'beta/prepare-workflow-0.4.42.mjs'
      - '.github/workflows/prepare-0.4.42.yml'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update release workflow
        run: |
          node beta/prepare-workflow-0.4.42.mjs
          rm -f .github/workflows/prepare-0.4.42.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/seed-beta.yml .github/workflows/prepare-0.4.42.yml
          if git diff --cached --quiet; then
            echo "Release workflow already prepared."
            exit 0
          fi
          git commit -m "Prepare NPC State v0.4.42 release workflow"
          git push
