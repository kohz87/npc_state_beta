name: v0528 release candidate

on:
  push:
    branches: [release/v0.5.28]

permissions:
  contents: write

jobs:
  apply:
    if: contains(github.event.head_commit.message, 'run v0.5.28 release candidate')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v0.5.28
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply candidate patch
        run: node scripts/v0528-release.tmp.mjs
      - name: Required release checks
        run: |
          npm run validate
          npm test
          npm run package
          npm run measure:scan-prompts
      - name: Commit verified candidate
        run: |
          rm scripts/v0528-release.tmp.mjs
          git config user.name "kohz87"
          git config user.email "83744063+kohz87@users.noreply.github.com"
          git add -A
          git commit -m "fix: unify new npc identity enrichment"
          git push origin HEAD:release/v0.5.28
