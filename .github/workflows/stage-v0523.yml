name: NPC State Stage v0.5.23

on:
  push:
    branches:
      - fix/v0.5.23-evidence-reuse-release
    paths:
      - .github/workflows/stage-v0523.yml

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: fix/v0.5.23-evidence-reuse-release
          fetch-depth: 0
      - name: Apply exact reviewed v0.5.23 patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/v0523-stage/part-* > /tmp/v0523.patch.gz.b64
          echo "6b16a311422219c1eb92275125393da221ccede0a2ee75c0f7aa06820b11a6f8  /tmp/v0523.patch.gz.b64" | sha256sum -c -
          base64 -d /tmp/v0523.patch.gz.b64 | gzip -dc > /tmp/v0523.patch
          echo "37d6a6283e332d083c7999b66bedbde82c688be403cc8aeb39e6cb36bf337eaa  /tmp/v0523.patch" | sha256sum -c -
          git apply --check /tmp/v0523.patch
          git apply /tmp/v0523.patch
          rm -rf .github/v0523-stage .github/workflows/stage-v0523.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: finish Current Dynamic evidence reuse for v0.5.23"
          git push origin HEAD:fix/v0.5.23-evidence-reuse-release
