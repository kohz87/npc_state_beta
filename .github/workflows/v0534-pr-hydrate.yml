name: v0534 publish candidate

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/v0534-focused-fixes
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply reviewed local patch
        run: |
          base64 -d .v0534-final.diff.gz.b64 | gzip -d > /tmp/v0534.diff
          patch -p2 < /tmp/v0534.diff
          rm -f .v0534-final.diff.gz.b64 .github/workflows/v0534-candidate.yml .github/workflows/v0534-pr-hydrate.yml
      - name: Verify transferred candidate
        run: |
          npm run validate
          npm test
          npm run package
          npm run measure:scan-prompts
      - name: Commit candidate
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Release v0.5.34 focused evidence grounding fixes'
          git push origin HEAD:work/v0534-focused-fixes
