name: v0534 hydrate candidate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  hydrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Package clean baseline
        run: tar -czf /tmp/npc_state_beta_main.tgz --exclude=.git .
      - uses: actions/upload-artifact@v4
        with:
          name: npc-state-main-baseline
          path: /tmp/npc_state_beta_main.tgz
          retention-days: 1
