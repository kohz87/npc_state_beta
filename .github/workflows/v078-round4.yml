name: v078 round 4 publisher
on:
  push:
    branches: [automation/v078-review]
    paths: [.github/workflows/v078-round4.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply round 4 fix
        run: |
          base64 -d scripts/v078-round4.patch.gz.b64 | gzip -d > /tmp/r4.patch
          git fetch origin automation/v078-candidate
          git checkout -B automation/v078-candidate origin/automation/v078-candidate
          git apply --check /tmp/r4.patch
          git apply /tmp/r4.patch
          git diff --check
      - name: Validate exact candidate
        run: |
          npm run validate
          npm test
          npm run package
          unzip -t dist/npc_state_beta-0.7.8.zip
      - name: Commit and push
        run: |
          git config user.name 'OpenAI automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md README.md docs/core-contract.md src/model/semantic-updates.js src/scan-application.js src/scan-payload.js src/scan-relationships.js src/scanner.js tests/v078-focused-value-boundaries.test.mjs
          git commit -m 'fix: reject malformed focused proposal text values' -m 'Independent Round 4 value-boundary review found object-to-text coercion outside ordinary dossier fields: social/family graph values, lifecycle scalars, relationship reason metadata, and Current Dynamic could retain JavaScript object text. Filter malformed focused rows once at scanner coordination, make graph/family handlers string-only defensively, and type-check relationship metadata before persistence while preserving valid sibling proposals and evidence-grounded numeric scoring. Validation, 277 tests, packaging and ZIP integrity pass; release remains 0.7.8.'
          git push origin HEAD:automation/v078-candidate
          git rev-parse HEAD
