name: Apply v0.5.33 patch

on:
  push:
    branches:
      - fix/v0.5.33-follow-up
    paths:
      - '.github/workflows/apply-v0533.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v0.5.33-follow-up
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply patch and remove staging helpers
        run: |
          node scripts/fix-v0533-staging.mjs
          node scripts/apply-v0533.mjs
          rm scripts/fix-v0533-staging.mjs scripts/apply-v0533.mjs .github/workflows/apply-v0533.yml
      - name: Validate candidate
        run: |
          npm run validate
          npm test
          npm run package
          npm run measure:scan-prompts
      - name: Commit candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix bounded first-contact follow-up"
          git push origin HEAD:fix/v0.5.33-follow-up
