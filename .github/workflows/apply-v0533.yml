name: Apply v0.5.33 candidate

on:
  push:
    branches:
      - fix/v0.5.33-follow-up-sol56

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v0.5.33-follow-up-sol56
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Normalize staging helper and focused fixture
        run: |
          python3 - <<'PY'
          import re
          p = 'scripts/apply-v0533.mjs'
          s = open(p, encoding='utf-8').read()
          start = s.index("once('src/settings-contract.js',")
          end = s.index("once('src/settings.js',", start)
          replacement = """once('src/settings-contract.js',
            'export function normalizeNumericSetting(key, value, fallback = NUMERIC_SETTINGS[key]?.default) {',
            `export const FIRST_CONTACT_FOLLOW_UP_MODES = Object.freeze(['off', 'missing_evaluations', 'recheck_unknown_fields']);\nexport function normalizeFirstContactFollowUpMode(value) {\n    const mode = String(value || '').trim().toLocaleLowerCase();\n    return FIRST_CONTACT_FOLLOW_UP_MODES.includes(mode) ? mode : 'off';\n}\n\nexport function normalizeNumericSetting(key, value, fallback = NUMERIC_SETTINGS[key]?.default) {`);
          """
          s = s[:start] + replacement + s[end:]
          marker = "fs.rmSync('tests/v0532-first-contact-completion.test.mjs');"
          i = s.index(marker)
          s = s[:i] + marker + "\nconsole.log('Applied v0.5.33 patch');\n"
          open(p, 'w', encoding='utf-8').write(s)

          p = 'tests/v0533-optional-first-contact-recheck.test.mjs'
          t = open(p, encoding='utf-8').read()
          t = re.sub(r"\}\), \{ state: (.+) \}\);$", r"}, { state: \1 }));", t, flags=re.MULTILINE)
          t = t.replace("    assert.equal(latest(h).followUp.remainingOutcomes, 0);\n  }, { state: createEmptyState('chat:actor.png:fixture'), settings: { firstContactFollowUpMode: 'recheck_unknown_fields' } }));",
                        "    const followUp = latest(h).followUp;\n    assert.ok(followUp.requestedFields > 1);\n    assert.equal(followUp.remainingOutcomes, followUp.requestedFields - 1);\n  }, { state: createEmptyState('chat:actor.png:fixture'), settings: { firstContactFollowUpMode: 'recheck_unknown_fields' } }));")
          t = t.replace("assert.deepEqual(h.persisted().socialEdges, []);", "assert.deepEqual(h.persisted().socialEdges || [], []);")
          anchor = "test('successful narrow repair clears only repaired warning and preserves protected state'"
          start = t.index(anchor)
          needle = "if (calls === 1) return JSON.stringify(firstPayload());"
          pos = t.index(needle, start)
          replacement = "if (calls === 1) {\n      const payload = firstPayload();\n      payload.npcs[0].fieldEvaluations.insufficient = payload.npcs[0].fieldEvaluations.insufficient.filter(field => field !== 'species');\n      return JSON.stringify(payload);\n    }"
          t = t[:pos] + replacement + t[pos + len(needle):]
          open(p, 'w', encoding='utf-8').write(t)
          PY
      - name: Apply candidate patch
        run: node scripts/apply-v0533.mjs
      - name: Compact prompt and align superseded regressions
        run: |
          python3 - <<'PY'
          def edit(path, old, new, count=None):
              s = open(path, encoding='utf-8').read()
              found = s.count(old)
              if count is not None and found != count:
                  raise SystemExit(f'{path}: expected {count} matches, found {found}: {old[:80]}')
              if found == 0:
                  raise SystemExit(f'{path}: no match: {old[:80]}')
              open(path, 'w', encoding='utf-8').write(s.replace(old, new))

          def section_edit(path, anchor, old, new, occurrences=1):
              s = open(path, encoding='utf-8').read()
              start = s.index(anchor)
              end = s.find('\ntest(', start + len(anchor))
              if end < 0: end = len(s)
              part = s[start:end]
              if part.count(old) != occurrences:
                  raise SystemExit(f'{path}: section {anchor} expected {occurrences} matches, found {part.count(old)}')
              part = part.replace(old, new)
              open(path, 'w', encoding='utf-8').write(s[:start] + part + s[end:])

          p = 'src/scan-helpers.js'
          lines = open(p, encoding='utf-8').read().splitlines()
          out = []
          profile = manner = goal = 0
          for line in lines:
              if "'PROFILE EVIDENCE:" in line:
                  out.append("        'BEHAVIOR PROFILE EVIDENCE: personality may be established narrowly from multiple reinforcing choices/reactions. behaviorProfile needs explicit recurrence/generalization or multiple reinforcing actions. Multiple related instances may consolidate into one narrow mannerism; one isolated gesture, mood, pose, line, or object action must not be rewritten as a habitual behavior and stays observation evidence.',")
                  profile += 1
                  continue
              if "'MANNERISM SUFFICIENCY:" in line:
                  manner += 1
                  continue
              if "'LIVE GOAL:" in line:
                  out.append("        'LIVE GOAL: store what remains to be done after the exchange; completed actions are not goals. Lasting completed registration/access may qualify as memory under the memory rubric.',")
                  goal += 1
                  continue
              out.append(line)
          if (profile, manner, goal) != (1, 1, 1):
              raise SystemExit(f'src/scan-helpers.js unexpected prompt rows: profile={profile} manner={manner} goal={goal}')
          open(p, 'w', encoding='utf-8').write('\n'.join(out) + '\n')

          anchor = "test('automatic post-response scan may complete a newly admitted dossier with a second bounded request and duplicate completion is idempotent'"
          s = open('tests/post-response-rework.test.mjs', encoding='utf-8').read()
          start = s.index(anchor)
          end = s.find('\ntest(', start + len(anchor))
          part = s[start:end]
          old = "    setProvider(h, payloadForBessa(completeFields()));"
          new = """    let providerCalls = 0;\n    setProvider(h, ({ prompt }) => {\n        providerCalls += 1;\n        if (providerCalls === 1) return JSON.stringify(payloadForBessa(completeFields()));\n        const id = prompt.match(/\\\"id\\\":\\\"([^\\\"]+)\\\",\\\"name\\\":\\\"Bessa Vond\\\"/)?.[1];\n        const fields = JSON.parse(prompt.match(/\\\"unresolvedFields\\\":(\\[[^\\]]*\\])/)?.[1] || '[]');\n        return JSON.stringify({ exchangeActiveNpcIds: [], inChatNpcIds: [], worldActiveNpcIds: [], npcs: [{ id, name: 'Bessa Vond', fieldEvaluations: { insufficient: fields } }], socialEdges: [], familyFacts: [], lifeStateUpdates: [], candidateAccounting: {} });\n    });"""
          if part.count(old) != 1:
              raise SystemExit('post-response completion fixture did not match once')
          part = part.replace(old, new)
          part = part.replace("{ settings: { birthdayFillMode: 'off' } }", "{ settings: { birthdayFillMode: 'off', firstContactFollowUpMode: 'recheck_unknown_fields' } }")
          open('tests/post-response-rework.test.mjs', 'w', encoding='utf-8').write(s[:start] + part + s[end:])

          section_edit('tests/post-response-rework.test.mjs',
                       "test('next-generation interceptor waits for preceding scan after user append and scanner quiet generation does not recurse'",
                       'assert.equal(h.metrics.generations, 2);', 'assert.equal(h.metrics.generations, 1);')
          edit('tests/v0512-gap-fixes.test.mjs', 'assert.equal(h.metrics.generations, 3);', 'assert.equal(h.metrics.generations, 2);', 1)
          edit('tests/structure.test.mjs', "assert.equal(manifest.version, '0.5.32');", "assert.equal(manifest.version, '0.5.33');", 1)
          edit('tests/structure.test.mjs', "/NPC_STATE_VERSION = '0.5.32'/", "/NPC_STATE_VERSION = '0.5.33'/", 1)
          edit('tests/v0530-first-contact-profile.test.mjs', "assert.equal(h.metrics.generations, mode === 'stale' ? 1 : 2);", "assert.equal(h.metrics.generations, 1);", 1)
          section_edit('tests/v075-identity-handoff.test.mjs',
                       "test('dedicated Scan retains a complete new dossier when model emits a nonempty transport id'",
                       'assert.equal(h.generations(), 2);', 'assert.equal(h.generations(), 1);')
          section_edit('tests/v076-first-pass-completeness.test.mjs',
                       "test('successful dedicated Sanna scan commits and persists the dossier'",
                       'assert.equal(harness.generations(), 2);', 'assert.equal(harness.generations(), 1);')
          section_edit('tests/v076-first-pass-completeness.test.mjs',
                       "test('follow-up Scan uses the assigned stable id without duplicating Sanna or replaying relationship scoring'",
                       'assert.equal(harness.generations(), 3);', 'assert.equal(harness.generations(), 2);')
          section_edit('tests/v077-host-capture.test.mjs',
                       "test('legacy-compatible host response still applies valid proposals but cannot falsely report complete candidate/field coverage'",
                       'assert.equal(h.metrics.generations, 2);', 'assert.equal(h.metrics.generations, 1);', 2)
          section_edit('tests/v077-host-capture.test.mjs',
                       "test('lengthy narrative with Inventory preserves user-visible content while new admission completion stays bounded'",
                       'assert.equal(h.metrics.generations, 2);', 'assert.equal(h.metrics.generations, 1);')
          edit('tests/v077-host-capture.test.mjs',
               "test('lengthy narrative with Inventory preserves user-visible content while new admission completion stays bounded'",
               "test('lengthy narrative with Inventory preserves user-visible content with default follow-up Off'", 1)
          PY
      - name: Remove staging helpers
        run: rm scripts/apply-v0533.mjs .github/workflows/apply-v0533.yml
      - name: Validate authoritative source
        run: npm run validate
      - name: Run focused v0.5.33 regressions
        run: node --test tests/v0533-optional-first-contact-recheck.test.mjs
      - name: Run full regression tests
        run: |
          set +e
          npm test > /tmp/full-tests.log 2>&1
          code=$?
          if [ "$code" -ne 0 ]; then
            grep -n -E 'not ok|AssertionError|ERR_ASSERTION|failureType|error:|fail [0-9]+' /tmp/full-tests.log -B 12 -A 35 || tail -n 250 /tmp/full-tests.log
            exit "$code"
          fi
          cat /tmp/full-tests.log
      - name: Package extension
        run: npm run package
      - name: Measure scan prompts
        run: npm run measure:scan-prompts
      - name: Commit validated candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Implement optional first-contact follow-up"
          git push origin HEAD:fix/v0.5.33-follow-up-sol56
