name: Apply v0.5.33 candidate

on:
  push:
    branches:
      - fix/v0.5.33-follow-up-sol56

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v0.5.33-follow-up-sol56
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Normalize staging helper
        run: |
          python3 - <<'PY'
          p = 'scripts/apply-v0533.mjs'
          s = open(p, encoding='utf-8').read()
          marker = "fs.rmSync('tests/v0532-first-contact-completion.test.mjs');"
          i = s.index(marker)
          s = s[:i] + marker + "\nconsole.log('Applied v0.5.33 patch');\n"
          open(p, 'w', encoding='utf-8').write(s)
          PY
      - name: Apply candidate patch
        run: node scripts/apply-v0533.mjs
      - name: Remove staging helpers
        run: rm scripts/apply-v0533.mjs .github/workflows/apply-v0533.yml
      - name: Validate authoritative source
        run: npm run validate
      - name: Run regression tests
        run: npm test
      - name: Package extension
        run: npm run package
      - name: Measure scan prompts
        run: npm run measure:scan-prompts
      - name: Commit validated candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Implement optional first-contact follow-up"
          git push origin HEAD:fix/v0.5.33-follow-up-sol56
