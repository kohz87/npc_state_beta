name: NPC State Stage v0.5.18

on:
  push:
    branches:
      - perf/v0.5.18-prompt-compaction
    paths:
      - '.github/workflows/stage-v0518.yml'

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: perf/v0.5.18-prompt-compaction
          fetch-depth: 0
      - name: Apply exact tested v0.5.18 patch
        shell: bash
        run: |
          cat .npc-state-v0518.part-00 .npc-state-v0518.part-01 .npc-state-v0518.part-02-0 .npc-state-v0518.part-02-1 .npc-state-v0518.part-02-2 .npc-state-v0518.part-02-3 .npc-state-v0518.part-03 .npc-state-v0518.part-04 .npc-state-v0518.part-05 > /tmp/v0518.patch.gz.b64
          echo "94923c289f5091f810742cae950b7436f421f17cf1ab91cf7afbb844814cc332  /tmp/v0518.patch.gz.b64" | sha256sum -c -
          base64 -d /tmp/v0518.patch.gz.b64 | gzip -d > /tmp/v0518.patch
          echo "10a18245a0fb6ae0d3d04669a4fc2e7c93d9a437a642cf43dcadbfe2faa2752d  /tmp/v0518.patch" | sha256sum -c -
          git apply --check /tmp/v0518.patch
          git apply /tmp/v0518.patch
          rm -f .npc-state-v0518.patch.gz.b64 .npc-state-v0518.part-00 .npc-state-v0518.part-01 .npc-state-v0518.part-02 .npc-state-v0518.part-02-0 .npc-state-v0518.part-02-1 .npc-state-v0518.part-02-2 .npc-state-v0518.part-02-3 .npc-state-v0518.part-03 .npc-state-v0518.part-04 .npc-state-v0518.part-05
          rm .github/workflows/stage-v0518.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "perf: compact scanner prompts for v0.5.18"
          git push origin HEAD:perf/v0.5.18-prompt-compaction
