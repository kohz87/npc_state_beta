name: Build v0.5.12 candidate

on:
  push:
    branches:
      - automation/v0512-gap-fixes
    paths:
      - scripts/release-v0512.py
      - scripts/release-v0512-followup.py
      - .github/workflows/v0512-release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply release metadata
        run: |
          python3 scripts/release-v0512.py
          python3 scripts/release-v0512-followup.py
      - name: Validate
        run: npm run validate
      - name: Test
        run: npm test
      - name: Package
        run: npm run package
      - name: Verify installable package
        run: |
          test -f dist/npc_state_beta-0.5.12.zip
          count=$(unzip -Z1 dist/npc_state_beta-0.5.12.zip | wc -l)
          test "$count" -eq 55
          ! unzip -Z1 dist/npc_state_beta-0.5.12.zip | grep -E '(^|/)(tests|scripts|docs|\.github)/'
          unzip -p dist/npc_state_beta-0.5.12.zip npc_state_beta-0.5.12/manifest.json | grep -q '"version": "0.5.12"'
          sha256sum dist/npc_state_beta-0.5.12.zip
      - name: Diff check
        run: git diff --check
      - name: Commit final candidate tree
        run: |
          rm scripts/release-v0512.py scripts/release-v0512-followup.py .github/workflows/v0512-release.yml
          git add -A
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "release: NPC State Beta 0.5.12"
          git push origin HEAD:automation/v0512-gap-fixes
