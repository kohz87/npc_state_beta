name: v0.7.5 identity handoff verification

on:
  push:
    branches:
      - automation/v075-identity-handoff
    paths:
      - 'scripts/apply-v075.py'
      - 'scripts/apply-v075-fix.py'
      - '.github/workflows/v075-verify.yml'

permissions:
  contents: write

jobs:
  patch-verify-commit:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out candidate branch
        uses: actions/checkout@v4
        with:
          ref: automation/v075-identity-handoff
          fetch-depth: 0
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply focused repair
        run: |
          python3 scripts/apply-v075.py
          python3 scripts/apply-v075-fix.py
      - name: Validate authoritative source
        run: npm run validate
      - name: Run full regression suite
        run: npm test
      - name: Package extension
        run: npm run package
      - name: Inspect package and complete diff
        run: |
          unzip -l dist/*.zip
          git diff --stat da9384f85281d91143901d8e735046b3f226667f
          git diff --check
      - name: Remove temporary scaffolding and commit verified candidate
        run: |
          rm scripts/apply-v075.py
          rm scripts/apply-v075-fix.py
          rm .github/workflows/v075-verify.yml
          git config user.name "OpenAI automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          test ! -e scripts/apply-v075.py
          test ! -e scripts/apply-v075-fix.py
          test ! -e .github/workflows/v075-verify.yml
          git diff --cached --check
          git commit -m "fix: carry accepted NPC identity through first-pass application"
          git push origin HEAD:automation/v075-identity-handoff
