name: v077 source export
on:
  push:
    branches: [automation/v077-contract-review]
    paths: [.github/workflows/v077-source.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ae85c0a680792e68a1b8631deb94fabc0f2b5080
          fetch-depth: 0
      - name: Export baseline source and git objects
        run: git bundle create /tmp/npc-source.bundle HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: npc-review-source
          path: /tmp/npc-source.bundle
          retention-days: 1
