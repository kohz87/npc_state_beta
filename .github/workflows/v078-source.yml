name: v078 source export
on:
  push:
    branches: [automation/v078-review]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Archive source
        run: |
          tar --exclude=.git --exclude=dist -czf /tmp/npc-state-source.tgz .
      - uses: actions/upload-artifact@v4
        with:
          name: npc-state-v078-source
          path: /tmp/npc-state-source.tgz
          retention-days: 1
