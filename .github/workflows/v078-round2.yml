name: v078 round 2 publisher
on:
  push:
    branches: [automation/v078-review]
    paths: [.github/workflows/v078-round2.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply round 2 fix
        run: |
          base64 -d scripts/v078-round2.patch.gz.b64 | gzip -d > /tmp/r2.patch
          git fetch origin automation/v078-candidate
          git checkout -B automation/v078-candidate origin/automation/v078-candidate
          git apply --check /tmp/r2.patch
          git apply /tmp/r2.patch
          git diff --check
      - name: Validate exact candidate
        run: |
          npm run validate
          npm test
          npm run package
          unzip -t dist/npc_state_beta-0.7.8.zip
      - name: Commit and push
        run: |
          git config user.name 'OpenAI automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md docs/core-contract.md src/model/legacy-semantic-adapter.js src/model/semantic-updates.js tests/v078-fallback-value-validation.test.mjs
          git commit -m 'fix: validate legacy field shapes before compaction' -m 'Independent contract/value review found that named-preferred role compatibility and legacy direct live/form adapters could stringify invalid objects before the canonical field validator, including [object Object], and could double-count an invalid new role. Preserve raw compatibility proposals until shared registry validation, reject malformed live/form values with concrete diagnostics, and keep valid named-preferred roles working. Validation, 273 tests, packaging and ZIP integrity pass; release remains 0.7.8.'
          git push origin HEAD:automation/v078-candidate
          git rev-parse HEAD
