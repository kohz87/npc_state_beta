name: v0.5.31 review-fix verification

on:
  push:
    branches:
      - fix/v0531-live-evidence-birthday-provenance

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply deliberate review fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/foreground-context.js')
          s = p.read_text()
          old = "npc.id, npc.name, (npc.aliases || []).join('|'), npc.role, npc.species, npc.age, npc.apparentAge, npc.birthday, npc.birthdayProvenance,"
          new = "npc.id, npc.name, (npc.aliases || []).join('|'), npc.role, npc.species, npc.age, npc.apparentAge, npc.birthday, npc.birthdayProvenance === 'generated' ? 'generated' : '',"
          if old not in s:
              raise SystemExit('expected cache signature line not found')
          p.write_text(s.replace(old, new, 1))
          PY
          rm .github/workflows/verify-v0531-review-temp.yml
      - name: Diff sanity
        run: |
          git diff --check
          git status --short
      - name: Validate
        run: npm run validate
      - name: Tests
        run: npm test
      - name: Package
        run: npm run package
      - name: Measure scanner prompts
        run: npm run measure:scan-prompts
      - name: Commit reviewed candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Align v0.5.31 foreground cache provenance"
          git push origin HEAD:fix/v0531-live-evidence-birthday-provenance
