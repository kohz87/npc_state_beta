name: NPC State Stage v0.5.24
on:
  push:
    branches:
      - fix/v0.5.24-presentation-evidence
    paths:
      - .github/workflows/stage-v0524.yml
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify and apply reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          cat .npc-state-v0524-part01 .npc-state-v0524-part02 .npc-state-v0524-part03 > /tmp/v0524.patch.gz.b64
          test "$(sha256sum /tmp/v0524.patch.gz.b64 | awk '{print $1}')" = "2fd18d28af13287316fd10eac8d1fb4fc094eaa109ea4b0e90cb654c1a32a959"
          base64 -d /tmp/v0524.patch.gz.b64 | gzip -d > /tmp/v0524.patch
          test "$(sha256sum /tmp/v0524.patch | awk '{print $1}')" = "d557199729fbb2f0f8a7423ad8ab7468c35c13fd2666e02760d98cebea431809"
          git apply --check /tmp/v0524.patch
          git apply /tmp/v0524.patch
          rm -f .npc-state-v0524-part01 .npc-state-v0524-part02 .npc-state-v0524-part03 .github/workflows/stage-v0524.yml
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: normalize presentation evidence for v0.5.24"
          git push origin HEAD:fix/v0.5.24-presentation-evidence
