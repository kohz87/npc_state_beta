name: NPC State Stage v0.5.17

on:
  push:
    branches:
      - 'fix/v0.5.17-phase1-corrections'
    paths:
      - '.github/workflows/ci.yml'

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact tested corrective patch
        run: |
          cat scripts/.v0517.patch.b64.* | base64 --decode > /tmp/v0517.patch
          echo 'e0a9b14f66ed6ce92bcac6e16ffdb4004a09a7d2fc4dfcbe17ea75d927cd4a1d  /tmp/v0517.patch' | sha256sum -c -
          git apply --check /tmp/v0517.patch
          git apply /tmp/v0517.patch
          git checkout origin/main -- .github/workflows/ci.yml
          rm scripts/.v0517.patch.b64.*
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: correct Phase 1 observation evidence handling'
          git push origin HEAD:${GITHUB_REF_NAME}
