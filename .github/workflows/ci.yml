name: NPC State Stage v0.5.16

on:
  push:
    branches:
      - 'feat/v0.5.16-grounded-observation-final'
    paths:
      - 'scripts/stage-v0516.mjs'

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply tested v0.5.16 patch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          for patch in scripts/v0516-part-*.patch; do
            git apply "$patch"
          done
          git checkout origin/main -- .github/workflows/ci.yml
          rm -f scripts/v0516-part-*.patch scripts/stage-v0516.mjs
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: add source-owned grounded observations"
          git push origin HEAD:${GITHUB_REF_NAME}
