name: NPC State CI

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - '.github/workflows/ci.yml'
      - 'manifest.json'
      - 'package.json'
      - 'bootstrap.js'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'DEVELOPMENT.md'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: fix/v0.5.33-follow-up-sol56
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply reviewed ownership fix
        run: |
          python3 - <<'PY'
          p = 'src/engine.js'
          s = open(p, encoding='utf-8').read()
          old = """                    } catch (error) {
                        if (signal?.aborted) {
                            finishDiscardedOperation(operationId, 'scan-cancelled', 'first-contact-completion');
                            return { ok: false, discarded: true, reason: 'scan-cancelled', messageId };
                        }
                        const reason = String(error?.message || error).slice(0, 300);
"""
          new = """                    } catch (error) {
                        const failedCompletionChat = getContext().chat || [];
                        if (signal?.aborted || !operationOwnershipMatches(ownership) || (expectedSource && !sourceDescriptorMatches(expectedSource, chatKey, failedCompletionChat, messageId))) {
                            finishDiscardedOperation(operationId, signal?.aborted ? 'scan-cancelled' : 'stale-operation', 'first-contact-completion-failed');
                            return { ok: false, discarded: true, reason: signal?.aborted ? 'scan-cancelled' : 'stale-operation', messageId };
                        }
                        const reason = String(error?.message || error).slice(0, 300);
"""
          if s.count(old) != 1:
              raise SystemExit(f'engine ownership catch match count {s.count(old)}')
          open(p, 'w', encoding='utf-8').write(s.replace(old, new))

          p = 'tests/v0533-optional-first-contact-recheck.test.mjs'
          t = open(p, encoding='utf-8').read()
          anchor = "test('manual Recheck missing details is current-exchange-only and isolated from focused state channels'"
          if anchor not in t:
              raise SystemExit('manual recheck test anchor missing')
          test = r'''test('follow-up provider failure after edit, swipe, or chat change discards stale first-pass state', async t => {
  for (const kind of ['edit','swipe','chat']) await t.test(kind, () => withHost(async h => {
    h.context.chat = structuredClone(chat);
    let calls = 0;
    h.context.generateRaw = async () => {
      h.metrics.generations += 1; calls += 1;
      if (calls === 1) return JSON.stringify(firstPayload());
      if (kind === 'edit') h.context.chat[1].mes += ' edited-before-failure';
      if (kind === 'swipe') h.context.chat[1].swipe_id = 2;
      if (kind === 'chat') h.context.chatId = 'other-chat-before-failure';
      throw new Error('provider failed after ownership changed');
    };
    const result = await h.entry.processCompletedAssistantResponse(1);
    assert.equal(result.discarded, true);
    assert.equal(result.reason, 'stale-operation');
    assert.equal(h.persisted().npcs.length, 0);
    assert.equal(h.metrics.posts, 0);
  }, { state: createEmptyState('chat:actor.png:fixture'), settings: { firstContactFollowUpMode: 'missing_evaluations' } }));
});

'''
          t = t.replace(anchor, test + anchor, 1)
          open(p, 'w', encoding='utf-8').write(t)
          PY
      - name: Remove temporary validation scaffolding
        run: |
          rm -f .github/workflows/review-fix-v0533.yml
          cat > .github/workflows/ci.yml <<'YAML'
          name: NPC State CI

          on:
            workflow_dispatch:
            push:
              paths:
                - 'src/**'
                - 'tests/**'
                - 'scripts/**'
                - '.github/workflows/ci.yml'
                - 'manifest.json'
                - 'package.json'
                - 'bootstrap.js'
                - 'README.md'
                - 'CHANGELOG.md'
                - 'DEVELOPMENT.md'
            pull_request:
              paths:
                - 'src/**'
                - 'tests/**'
                - 'scripts/**'
                - '.github/workflows/ci.yml'
                - 'manifest.json'
                - 'package.json'
                - 'bootstrap.js'
                - 'README.md'
                - 'CHANGELOG.md'
                - 'DEVELOPMENT.md'

          permissions:
            contents: read

          jobs:
            validate:
              runs-on: ubuntu-latest
              steps:
                - name: Check out source
                  uses: actions/checkout@v4
                - name: Set up Node
                  uses: actions/setup-node@v4
                  with:
                    node-version: '22'
                - name: Validate authoritative source
                  run: npm run validate
                - name: Run regression tests
                  run: npm test
                - name: Package extension
                  run: npm run package
                - name: Upload package
                  uses: actions/upload-artifact@v4
                  with:
                    name: npc-state-beta-package
                    path: dist/*.zip
                    if-no-files-found: error
          YAML
      - name: Validate authoritative source
        run: npm run validate
      - name: Run focused v0.5.33 regressions
        run: node --test tests/v0533-optional-first-contact-recheck.test.mjs
      - name: Run full regression suite
        run: npm test
      - name: Package extension
        run: npm run package
      - name: Measure scan prompts
        run: npm run measure:scan-prompts
      - name: Commit reviewed fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Guard failed follow-up ownership"
          git push origin HEAD:fix/v0.5.33-follow-up-sol56
