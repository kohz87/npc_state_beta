name: NPC State CI

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - '.github/workflows/ci.yml'
      - 'manifest.json'
      - 'package.json'
      - 'bootstrap.js'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'DEVELOPMENT.md'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - '.github/workflows/ci.yml'
      - 'manifest.json'
      - 'package.json'
      - 'bootstrap.js'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'DEVELOPMENT.md'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate authoritative source
        run: npm run validate
      - name: Run regression tests
        run: npm test
      - name: Package extension
        run: npm run package
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: npc-state-beta-package
          path: dist/*.zip
          if-no-files-found: error
