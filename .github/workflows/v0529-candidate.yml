name: v0.5.29 candidate

on:
  push:
    branches:
      - fix/v0529-current-dynamic-reuse
    paths:
      - .github/workflows/v0529-candidate.yml
      - scripts/v0529-release.py

permissions:
  contents: write

jobs:
  candidate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out candidate branch
        uses: actions/checkout@v4
        with:
          ref: fix/v0529-current-dynamic-reuse
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply release patch
        run: python3 scripts/v0529-release.py
      - name: Validate authoritative source
        run: npm run validate
      - name: Run regression tests
        run: npm test
      - name: Package extension
        run: npm run package
      - name: Measure scanner prompts
        run: npm run measure:scan-prompts
      - name: Inspect whitespace
        run: git diff --check
      - name: Commit verified candidate
        run: |
          git config user.name "kohz87"
          git config user.email "83744063+kohz87@users.noreply.github.com"
          git add CHANGELOG.md DEVELOPMENT.md README.md docs/core-contract.md manifest.json src/scan-relationships.js src/schema.js tests/structure.test.mjs tests/v0529-current-dynamic-source-reuse.test.mjs
          git commit -m "candidate: v0.5.29 Current Dynamic source reuse"
          git push origin HEAD:fix/v0529-current-dynamic-reuse
