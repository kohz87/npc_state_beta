name: Build NPC State 0.4.28 Beta

on:
  workflow_dispatch:
  push:
    paths:
      - 'beta/*.mjs'
      - '.github/workflows/seed-beta.yml'
      - 'v03/**'
      - 'manifest.json'
      - 'package.json'
      - 'bootstrap.js'
      - 'README.md'
      - 'CHANGELOG.md'

permissions:
  contents: write

jobs:
  build-beta:
    runs-on: ubuntu-latest
    steps:
      - name: Check out beta
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Once CI has committed the regenerated v0.4.28 runtime, test that exact checkout
      # before replacing v03 from the pinned stable baseline. This catches source/build
      # drift such as transformed verifier fixtures omitted from the generated commit.
      - name: Source checkout behavior gate
        run: |
          if grep -q '"version": "0.4.28"' manifest.json; then
            npm test
          else
            echo "Checked-in runtime is still the v0.4.27 source baseline; cold build will generate v0.4.28 first."
          fi

      - name: Fetch pinned stable NPC State baseline
        run: |
          rm -rf /tmp/npc-state-stable
          git clone https://github.com/kohz87/npc_state.git /tmp/npc-state-stable
          cd /tmp/npc-state-stable
          git checkout a12b2937b5c1305e3e3017218a626478a5bedcdc
          test "$(git rev-parse HEAD)" = "a12b2937b5c1305e3e3017218a626478a5bedcdc"
          cd "$GITHUB_WORKSPACE"
          rm -rf v03
          cp -R /tmp/npc-state-stable/v03 ./v03
          cp /tmp/npc-state-stable/bootstrap.js ./bootstrap.js
          cp /tmp/npc-state-stable/manifest.json ./manifest.json
          cp /tmp/npc-state-stable/package.json ./package.json

      - name: Apply 0.4.28 transformation in ordered phases
        run: |
          node beta/build-beta-v2.mjs
          node beta/post-build-patch.mjs
          node beta/harden-0.4.1.mjs
          node beta/fix-0.4.1-roster-copy.mjs
          node beta/fix-0.4.1-new-npc-bootstrap.mjs
          node beta/fix-0.4.1-first-run-stable-probe.mjs
          node beta/fix-0.4.1-key-relationship-shape.mjs
          node beta/fix-0.4.1-multi-npc-bootstrap.mjs
          node beta/fix-0.4.1-multi-npc-update.mjs
          node beta/fix-0.4.1-canonical-branch-fingerprint.mjs
          node beta/fix-0.4.1-deep-hardening.mjs
          node beta/fix-0.4.1-prelock-stale-embedded.mjs
          node beta/fix-0.4.1-missing-embedded-fallback.mjs
          node beta/fix-0.4.1-status-semantics.mjs
          node beta/fix-0.4.1-new-npc-id-authority.mjs
          node beta/fix-0.4.1-display-name-authority.mjs
          node beta/fix-0.4.1-age-semantics.mjs
          node beta/fix-0.4.1-form-aware-appearance.mjs
          node beta/fix-0.4.1-form-capture-semantics.mjs
          node beta/fix-0.4.1-form-baseline-recovery.mjs
          node beta/fix-0.4.1-relationship-milestone-gates.mjs

          # Replay every release transform in numeric patch order. The historical marker
          # comments below stay source-visible because descendant verifiers intentionally
          # assert that each older release remains part of the cold-build chain.
          for patch in $(seq 2 28); do
            node "beta/bump-0.4.${patch}.mjs"
            for phase in $(find beta -maxdepth 1 -name "phase*-0.4.${patch}.mjs" -print | sort); do
              echo "Applying $phase"
              node "$phase"
            done
          done

          # Historical source-parity markers retained for descendant verifier contracts.
          # node beta/bump-0.4.2.mjs ; -name 'phase*-0.4.2.mjs'
          # node beta/bump-0.4.3.mjs ; -name 'phase*-0.4.3.mjs'
          # node beta/bump-0.4.4.mjs ; -name 'phase*-0.4.4.mjs'
          # node beta/bump-0.4.5.mjs ; -name 'phase*-0.4.5.mjs'
          # node beta/bump-0.4.6.mjs ; -name 'phase*-0.4.6.mjs'
          # node beta/bump-0.4.7.mjs ; node beta/phase12-relationship-recovery-0.4.7.mjs ; -name 'phase*-0.4.7.mjs'
          # node beta/bump-0.4.8.mjs ; -name 'phase*-0.4.8.mjs'
          # node beta/bump-0.4.9.mjs ; -name 'phase*-0.4.9.mjs'
          # node beta/bump-0.4.10.mjs ; -name 'phase*-0.4.10.mjs'
          # node beta/bump-0.4.11.mjs ; -name 'phase*-0.4.11.mjs'
          # node beta/bump-0.4.12.mjs ; -name 'phase*-0.4.12.mjs'
          # node beta/bump-0.4.13.mjs ; -name 'phase*-0.4.13.mjs'
          # node beta/bump-0.4.14.mjs ; -name 'phase*-0.4.14.mjs'
          # node beta/bump-0.4.15.mjs ; -name 'phase*-0.4.15.mjs'
          # node beta/bump-0.4.16.mjs ; -name 'phase*-0.4.16.mjs'
          # node beta/bump-0.4.17.mjs ; -name 'phase*-0.4.17.mjs'
          # node beta/bump-0.4.18.mjs ; -name 'phase*-0.4.18.mjs'
          # node beta/bump-0.4.19.mjs ; -name 'phase*-0.4.19.mjs'
          # node beta/bump-0.4.20.mjs ; -name 'phase*-0.4.20.mjs'
          # node beta/bump-0.4.21.mjs ; -name 'phase*-0.4.21.mjs'
          # node beta/bump-0.4.22.mjs ; -name 'phase*-0.4.22.mjs'
          # node beta/bump-0.4.23.mjs ; -name 'phase*-0.4.23.mjs'
          # node beta/bump-0.4.24.mjs ; -name 'phase*-0.4.24.mjs'
          # node beta/bump-0.4.25.mjs ; -name 'phase*-0.4.25.mjs'
          # node beta/bump-0.4.26.mjs ; -name 'phase*-0.4.26.mjs'
          # node beta/bump-0.4.27.mjs ; -name 'phase*-0.4.27.mjs'
          # node beta/bump-0.4.28.mjs ; -name 'phase*-0.4.28.mjs'

      - name: Syntax gate
        run: |
          find beta -maxdepth 1 -name '*.mjs' -print0 | sort -z | xargs -0 -n1 node --check
          find v03 -maxdepth 1 -name '*.js' -print0 | sort -z | xargs -0 -n1 node --check
          node --check bootstrap.js

      - name: Consolidated behavior gate
        run: npm test

      - name: Architecture and migration gate
        run: |
          test ! -e beta/build-beta.mjs
          grep -q "getStablePointer" v03/engine.js
          grep -q "extension_settings?.npc_state?.v3?.dataFiles" v03/index.js
          grep -q "Optional stable v0.3 import pointer is stale; starting a fresh beta database" v03/engine.js
          grep -q "NPC_STATE_V04_BETA_MISSING_SIDECAR" v03/engine.js
          test ! -e v03/migrate-v02.js
          ! grep -q "readLegacyV02Sidecar" v03/engine.js
          ! grep -q "getLegacyPointer" v03/index.js
          grep -q "fallbackScan: false" v03/index.js
          grep -q "Malformed capture recovery" v03/ui.js
          grep -q "foreground-missing-control" v03/index.js
          ! grep -q "maybeForegroundFallback(id, 'missing-control')" v03/index.js
          grep -q "A single scan may introduce MULTIPLE new individually relevant NPCs" v03/injection.js
          grep -q "A single scan may update MULTIPLE existing NPCs" v03/injection.js
          grep -q "KeyRelationships entries MUST be strings, never objects" v03/injection.js
          grep -q "normalizeCurrentStatus" v03/schema.js
          grep -q "Never invent an npc-\* id" v03/injection.js
          grep -q "npcs.name is human-facing display text" v03/injection.js
          grep -q "function isTechnicalNpcIdentity" v03/scanner.js
          grep -q "function canonicalPatchName" v03/scanner.js
          grep -q "normalizeActualAge" v03/schema.js
          grep -q "normalizeAppearanceForms" v03/schema.js
          grep -q "RELATIONSHIP_MILESTONE_THRESHOLDS" v03/schema.js
          grep -q "relationshipMilestoneUnlocked" v03/scanner.js
          grep -q "RELATIONSHIP REPEATS AND GATES" v03/injection.js
          grep -q "relationshipProgress" v03/schema.js
          grep -q "relationshipEvidenceHistory" v03/schema.js
          grep -q "relationshipInertiaFactor" v03/scanner.js
          grep -q "if (magnitude <= 25) return 1;" v03/scanner.js
          grep -q "selectRelationshipAxes(delta, axisLimit, priority = \[\])" v03/scanner.js
          grep -q "relationshipSummarySupported" v03/scanner.js
          grep -q "relationshipContextForExchange" v03/engine.js
          grep -q "relationshipEvidenceExcerptMatch" v03/relationship-evidence.js
          grep -q "relationshipSources" v03/evidence-adapter.js
          grep -q "relationshipSemanticGrounding" v03/relationship-evidence.js
          grep -q "relationshipEvaluationDiagnostic" v03/scanner.js
          grep -q "evaluated-no-change" v03/scanner.js
          grep -q "relationshipJudgmentRubricPrompt" v03/relationship-policy.js
          grep -q "LEGACY_DEFAULT_RELATIONSHIP_CRITERIA_V0421" v03/index.js
          grep -q "function relationshipAxisProvenance" v03/scanner.js
          grep -q "function relationshipAxisLooksDuplicate" v03/scanner.js
          grep -q "function relationshipDuplicateEvidenceKey" v03/scanner.js
          ! grep -q "DESIRE_EVIDENCE_CUES" v03/scanner.js
          ! grep -q "relationshipEvidenceGrounding(" v03/scanner.js
          ! grep -q "relationshipEvidencePolarityConflict(" v03/scanner.js
          grep -q "relationshipHistoryRemarkHtml" v03/dossier-view.js
          grep -q "relationshipHistoryRecoveredAxisEvidence" v03/dossier-view.js
          grep -q "No explanation recorded." v03/dossier-view.js
          grep -q "const siblingLimit = 4" v03/branches.js
          grep -q "preserveLatestScannedMessage" v03/branches.js
          grep -q "rollbackRebasedRelationship" v03/branches.js
          grep -q "branchDivergenceMessageId" v03/branches.js
          grep -q "scannerNpcArrayValid" v03/scanner.js
          grep -q "preflightAutomaticIdentityPatches" v03/scanner.js
          grep -q "clauseAssertsNpcDeath" v03/scanner.js
          grep -q "affirmativeLivingReturnEvidence" v03/scanner.js
          grep -q "latestManualRelationshipAnchors" v03/branches.js
          ! grep -q "manualProtectedAxes" v03/branches.js
          grep -q "ageProgressionBaselineAge" v03/schema.js
          grep -q "manualApparentAgeChanged" v03/engine.js
          grep -q "reconcileFamilyGraph: false" v03/engine.js
          grep -q "worldStateIdentityBridgesVisibleIntroduction" v03/scanner.js
          grep -q "newReferenceAllowedByWorldIdentityBridge" v03/scanner.js
          grep -q "IDENTITY BRIDGE" v03/evidence-adapter.js
          grep -q "normalizeRelationshipCaps" v03/schema.js
          grep -q "OLDER CONTEXT — CONTINUITY ONLY; NOT NEW EVENT EVIDENCE" v03/scanner.js
          grep -q "visibleShortActivityIdentityMention" v03/scanner.js
          grep -q "shortActivityIdentityUnique" v03/scanner.js
          grep -q "groundedFamilyMemberNames" v03/scanner.js
          grep -q "projectFamilySlotMembers" v03/scanner.js
          grep -q "memberNames" v03/schema.js
          grep -q "FAMILY_KINSHIP_GROUPS" v03/scanner.js
          grep -q "reciprocalFamilyRelation" v03/scanner.js
          grep -q "resolveFamilySlotMember" v03/scanner.js
          grep -q "upsertFamilyRelationship" v03/scanner.js
          grep -q "splitWorldStatePresenceSections" v03/evidence-adapter.js
          grep -q "identityPresencePromptRules" v03/evidence-adapter.js
          grep -q "identityEvidenceVerified" v03/scanner.js
          grep -q "activityEvidenceVerified" v03/scanner.js
          grep -q "filter(id => !presentIds.includes(id))" v03/scanner.js
          grep -q "Persistent NPC State 0.4." v03/ui.js

          # v0.4.28 recovery/rebuild invariants.
          grep -q "normalizeRecoveryState" v03/schema.js
          grep -q "copy.recovery = null" v03/schema.js
          grep -q "createRecoveryV3Sidecar" v03/storage.js
          grep -q "NPC_STATE_V04_BETA_RECOVERY_SOURCE_EXISTS" v03/storage.js
          grep -q "startHistoricalRecovery" v03/engine.js
          grep -q "resumeHistoricalRecovery" v03/engine.js
          grep -q "historicalChat = liveChat.slice(0, nextMessageId + 1)" v03/engine.js
          grep -q "relationshipMode === 're-evaluate'" v03/engine.js
          grep -q "staleDeleteAfter: 1000000000" v03/engine.js
          grep -q "recoveryBlocksLiveScan" v03/engine.js
          grep -q "recoveryPending" v03/index.js
          grep -q "initializeFresh: options => engine.initializeFresh" v03/index.js
          grep -q "RECOVERY_REBUILD_UI_VERSION" v03/branch-recovery-ui.js
          grep -q "Rebase to current chat" v03/branch-recovery-ui.js
          grep -q "Force Timeline Rebase" v03/branch-recovery-ui.js
          grep -q "startBranchRecoveryUi" bootstrap.js
          grep -q '"version": "0.4.28"' manifest.json

      - name: Commit generated beta runtime
        run: |
          if git diff --quiet -- v03 bootstrap.js manifest.json package.json CHANGELOG.md README.md beta/verify-*.mjs; then
            echo "Generated beta runtime already matches build output."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v03 bootstrap.js manifest.json package.json CHANGELOG.md README.md beta/verify-*.mjs
          git commit -m "NPC State v0.4.28: recovery and chronological rebuild"
          git push
