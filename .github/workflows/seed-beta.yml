name: Build NPC State 0.4.24 Beta

on:
  workflow_dispatch:
  push:
    paths:
      - 'beta/*.mjs'
      - '.github/workflows/seed-beta.yml'
      - 'v03/**'
      - 'manifest.json'
      - 'package.json'
      - 'bootstrap.js'

permissions:
  contents: write

jobs:
  build-beta:
    runs-on: ubuntu-latest
    steps:
      - name: Check out beta
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch pinned stable NPC State baseline
        run: |
          rm -rf /tmp/npc-state-stable
          git clone https://github.com/kohz87/npc_state.git /tmp/npc-state-stable
          cd /tmp/npc-state-stable
          git checkout a12b2937b5c1305e3e3017218a626478a5bedcdc
          test "$(git rev-parse HEAD)" = "a12b2937b5c1305e3e3017218a626478a5bedcdc"
          cd "$GITHUB_WORKSPACE"
          rm -rf v03
          cp -R /tmp/npc-state-stable/v03 ./v03
          cp /tmp/npc-state-stable/bootstrap.js ./bootstrap.js
          cp /tmp/npc-state-stable/manifest.json ./manifest.json
          cp /tmp/npc-state-stable/package.json ./package.json

      - name: Apply 0.4.24 transformation in ordered phases
        run: |
          node beta/build-beta-v2.mjs
          node beta/post-build-patch.mjs
          node beta/harden-0.4.1.mjs
          node beta/fix-0.4.1-roster-copy.mjs
          node beta/fix-0.4.1-new-npc-bootstrap.mjs
          node beta/fix-0.4.1-first-run-stable-probe.mjs
          node beta/fix-0.4.1-key-relationship-shape.mjs
          node beta/fix-0.4.1-multi-npc-bootstrap.mjs
          node beta/fix-0.4.1-multi-npc-update.mjs
          node beta/fix-0.4.1-canonical-branch-fingerprint.mjs
          node beta/fix-0.4.1-deep-hardening.mjs
          node beta/fix-0.4.1-prelock-stale-embedded.mjs
          node beta/fix-0.4.1-missing-embedded-fallback.mjs
          node beta/fix-0.4.1-status-semantics.mjs
          node beta/fix-0.4.1-new-npc-id-authority.mjs
          node beta/fix-0.4.1-display-name-authority.mjs
          node beta/fix-0.4.1-age-semantics.mjs
          node beta/fix-0.4.1-form-aware-appearance.mjs
          node beta/fix-0.4.1-form-capture-semantics.mjs
          node beta/fix-0.4.1-form-baseline-recovery.mjs
          node beta/fix-0.4.1-relationship-milestone-gates.mjs

          # Replay every release transform in numeric patch order. The historical marker
          # comments below stay source-visible because descendant verifiers intentionally
          # assert that each older release remains part of the cold-build chain.
          for patch in $(seq 2 24); do
            node "beta/bump-0.4.${patch}.mjs"
            for phase in $(find beta -maxdepth 1 -name "phase*-0.4.${patch}.mjs" -print | sort); do
              echo "Applying $phase"
              node "$phase"
            done
          done

          # Historical source-parity markers retained for descendant verifier contracts.
          # node beta/bump-0.4.2.mjs ; -name 'phase*-0.4.2.mjs'
          # node beta/bump-0.4.3.mjs ; -name 'phase*-0.4.3.mjs'
          # node beta/bump-0.4.4.mjs ; -name 'phase*-0.4.4.mjs'
          # node beta/bump-0.4.5.mjs ; -name 'phase*-0.4.5.mjs'
          # node beta/bump-0.4.6.mjs ; -name 'phase*-0.4.6.mjs'
          # node beta/bump-0.4.7.mjs ; node beta/phase12-relationship-recovery-0.4.7.mjs ; -name 'phase*-0.4.7.mjs'
          # node beta/bump-0.4.8.mjs ; -name 'phase*-0.4.8.mjs'
          # node beta/bump-0.4.9.mjs ; -name 'phase*-0.4.9.mjs'
          # node beta/bump-0.4.10.mjs ; -name 'phase*-0.4.10.mjs'
          # node beta/bump-0.4.11.mjs ; -name 'phase*-0.4.11.mjs'
          # node beta/bump-0.4.12.mjs ; -name 'phase*-0.4.12.mjs'
          # node beta/bump-0.4.13.mjs ; -name 'phase*-0.4.13.mjs'
          # node beta/bump-0.4.14.mjs ; -name 'phase*-0.4.14.mjs'
          # node beta/bump-0.4.15.mjs ; -name 'phase*-0.4.15.mjs'
          # node beta/bump-0.4.16.mjs ; -name 'phase*-0.4.16.mjs'
          # node beta/bump-0.4.17.mjs ; -name 'phase*-0.4.17.mjs'
          # node beta/bump-0.4.18.mjs ; -name 'phase*-0.4.18.mjs'
          # node beta/bump-0.4.19.mjs ; -name 'phase*-0.4.19.mjs'
          # node beta/bump-0.4.20.mjs ; -name 'phase*-0.4.20.mjs'
          # node beta/bump-0.4.21.mjs ; -name 'phase*-0.4.21.mjs'
          # node beta/bump-0.4.22.mjs ; -name 'phase*-0.4.22.mjs'
          # node beta/bump-0.4.23.mjs ; -name 'phase*-0.4.23.mjs'
          # node beta/bump-0.4.24.mjs ; -name 'phase*-0.4.24.mjs'

      - name: Syntax gate
        run: |
          find beta -maxdepth 1 -name '*.mjs' -print0 | sort -z | xargs -0 -n1 node --check
          find v03 -maxdepth 1 -name '*.js' -print0 | sort -z | xargs -0 -n1 node --check
          node --check bootstrap.js

      - name: Consolidated behavior gate
        run: npm test

      - name: Architecture and migration gate
        run: |
          test ! -e beta/build-beta.mjs
          grep -q "getStablePointer" v03/engine.js
          grep -q "extension_settings?.npc_state?.v3?.dataFiles" v03/index.js
          grep -q "Optional stable v0.3 import pointer is stale; starting a fresh beta database" v03/engine.js
          ! grep -q "Stable NPC State v0.3 sidecar pointer exists but the file is missing. Refusing to create a blank beta replacement" v03/engine.js
          test ! -e v03/migrate-v02.js
          ! grep -q "readLegacyV02Sidecar" v03/engine.js
          ! grep -q "getLegacyPointer" v03/index.js
          grep -q "fallbackScan: false" v03/index.js
          grep -q "Malformed capture recovery" v03/ui.js
          grep -q "foreground-missing-control" v03/index.js
          ! grep -q "maybeForegroundFallback(id, 'missing-control')" v03/index.js
          grep -q "A single scan may introduce MULTIPLE new individually relevant NPCs" v03/injection.js
          grep -q "A single scan may update MULTIPLE existing NPCs" v03/injection.js
          grep -q "KeyRelationships entries MUST be strings, never objects" v03/injection.js
          grep -q "status is the NPC current concrete activity" v03/injection.js
          grep -q "normalizeCurrentStatus" v03/schema.js
          grep -q "Activity / condition" v03/dossier-view.js
          grep -q "Never invent an npc-\* id" v03/injection.js
          grep -q "npcs.name is human-facing display text" v03/injection.js
          grep -q "function isTechnicalNpcIdentity" v03/scanner.js
          grep -q "function canonicalPatchName" v03/scanner.js
          grep -q "id: makeNpcId(name" v03/scanner.js
          grep -q "normalizeActualAge" v03/schema.js
          grep -q "age is ACTUAL chronological age only" v03/injection.js
          grep -q "Actual age" v03/dossier-view.js
          grep -q "normalizeAppearanceForms" v03/schema.js
          grep -q "appearanceForms stores durable canonical descriptions" v03/scanner.js
          grep -q "A physical form MAY be temporary, reversible, magical, elemental, spectral, or energy-made" v03/scanner.js
          grep -q "Capture EVERY distinct form state explicitly entered in this response" v03/injection.js
          grep -q "RECOVERY: if an older scan already captured an alternate form but no Base entry" v03/scanner.js
          grep -q "name: 'Base'" v03/scanner.js
          grep -q "field('Appearance forms'" v03/injection.js
          ! grep -q "field('Current form', npc.currentForm)" v03/injection.js
          ! grep -q "field('Shared / ordinary appearance'" v03/injection.js
          grep -q "Appearance forms" v03/dossier-view.js
          ! grep -q "Shared / ordinary appearance" v03/dossier-view.js
          grep -q "Appearance forms · one per line as Form | description" v03/ui.js
          grep -q "currentFormAppearance" v03/portrait-prompt.js
          grep -q "RELATIONSHIP_MILESTONE_THRESHOLDS" v03/schema.js
          grep -q "relationshipMilestoneUnlocked" v03/scanner.js
          grep -q "RELATIONSHIP REPEATS AND GATES" v03/injection.js
          grep -q "50 major+ with raw 3" v03/injection.js
          grep -q "relationshipProgress" v03/schema.js
          grep -q "relationshipEvidenceHistory" v03/schema.js
          grep -q "relationshipInertiaFactor" v03/scanner.js
          grep -q "if (magnitude <= 25) return 1;" v03/scanner.js
          grep -q "if (magnitude <= 50) return 0.8;" v03/scanner.js
          grep -q "if (magnitude <= 75) return 0.6;" v03/scanner.js
          grep -q "if (magnitude <= 90) return 0.4;" v03/scanner.js
          grep -q "selectRelationshipAxes(delta, axisLimit, priority = \[\])" v03/scanner.js
          grep -q "relationshipSummarySupported" v03/scanner.js
          grep -q "relationshipContextForExchange" v03/engine.js
          grep -q "RELATIONSHIP EVALUATION IS REQUIRED for every NPC in exchangeActiveNpcIds" v03/injection.js
          grep -q "RELATIONSHIP EVALUATION IS REQUIRED for every NPC in exchangeActiveNpcIds" v03/scanner.js
          grep -q "relationshipEvaluationDiagnostic" v03/scanner.js
          grep -q "evaluated-no-change" v03/scanner.js
          grep -q "evaluation-missing" v03/scanner.js
          grep -q "relationshipEvidenceExcerptMatch" v03/relationship-evidence.js
          grep -q "relationshipSources" v03/evidence-adapter.js
          grep -q "function relationshipAxisProvenance" v03/scanner.js
          grep -q "axisEvidenceStatus" v03/scanner.js
          grep -q "relationshipEvidenceSources" v03/scanner.js
          grep -q "function relationshipAxisLooksDuplicate" v03/scanner.js
          grep -q "function relationshipDuplicateEvidenceKey" v03/scanner.js
          ! grep -q "DESIRE_EVIDENCE_CUES" v03/scanner.js
          ! grep -q "relationshipEvidenceGrounding(" v03/scanner.js
          ! grep -q "relationshipEvidencePolarityConflict(" v03/scanner.js
          grep -q "PER-AXIS RELATIONSHIP EVIDENCE" v03/injection.js
          grep -q "PER-AXIS RELATIONSHIP EVIDENCE" v03/scanner.js
          grep -q "RELATIONSHIP JUDGMENT AND PER-AXIS EVIDENCE" v03/relationship-policy.js
          grep -q "relationshipJudgmentRubricPrompt" v03/relationship-policy.js
          grep -q "NEW CHANGE & CONTINUITY" v03/relationship-policy.js
          grep -q "AMBIGUITY WITHOUT FREEZING" v03/relationship-policy.js
          grep -q "NO CIRCULAR JUSTIFICATION" v03/relationship-policy.js
          grep -q "relationshipJudgmentRubricPrompt()" v03/injection.js
          grep -q "relationshipJudgmentRubricPrompt()" v03/scanner.js
          grep -q "relationshipCustomCriteriaPrompt(settings.relationshipCriteria)" v03/injection.js
          grep -q "relationshipCustomCriteriaPrompt(relationshipCriteria)" v03/scanner.js
          grep -q "LEGACY_DEFAULT_RELATIONSHIP_CRITERIA_V0421" v03/index.js
          grep -q "Relationship criteria · additive" v03/ui.js
          grep -q "Verified source:" v03/dossier-view.js
          grep -q "partial-applied" v03/scanner.js
          grep -q "axisEvidence: normalizeRelationshipAxisEvidence(item?.axisEvidence)" v03/schema.js
          grep -q "relationshipHistoryRemarkHtml" v03/dossier-view.js
          grep -q "relationshipHistoryRecoveredAxisEvidence" v03/dossier-view.js
          grep -q "No explanation recorded." v03/dossier-view.js
          grep -q "Gate status and recent relationship evaluations" v03/dossier-view.js
          grep -q "const siblingLimit = 4" v03/branches.js
          grep -q "arraysEqual(item.lineage || \[\], lineage)" v03/branches.js
          grep -q "PRE_GATE_RELATIONSHIP_CRITERIA" v03/index.js
          grep -q "includeBoundary: true" v03/engine.js
          grep -q "expectedMessageText" v03/engine.js
          grep -q "expectedMessageText: consumed.cleanedText" v03/index.js
          grep -q "applyRelationship: !alreadyScannedMessage" v03/engine.js
          grep -q "Player relationship lens" v03/injection.js
          ! grep -q "Relationship toward PLAYER: trust" v03/injection.js
          grep -q "const dossierBudget = Math.max(0, Math.floor(maxChars \* 0.68))" v03/injection.js
          grep -q "Persistent NPC State 0.4.24 database" v03/ui.js
          ! grep -q "Persistent v0.3 database" v03/ui.js
          grep -q "branchFingerprintVersion: 3" v03/schema.js
          grep -q "Scanning & Capture" v03/settings-layout.js
          grep -q "Continuity Injection" v03/settings-layout.js
          grep -q "Birthday & Aging" v03/settings-layout.js
          grep -q "Relationships" v03/settings-layout.js
          grep -q "Recovery & Branch Safety" v03/settings-layout.js
          grep -q "ADVANCED_GROUP_ID" v03/settings-layout.js
          grep -q "npc_state_v0414_advanced_recovery" v03/settings-layout.js
          ! grep -q "'Advanced Rubrics'" v03/settings-layout.js
          grep -q "npc_state_v04_recovery_branch" v03/branch-recovery-ui.js
          grep -q "npc_state_v0414_advanced_recovery" v03/branch-recovery-ui.js
          grep -q "recovery.open = true" v03/branch-recovery-ui.js
          ! grep -q "host.insertBefore(banner, heading.nextSibling)" v03/branch-recovery-ui.js
          grep -q "Rebase to current chat" v03/branch-recovery-ui.js
          grep -q "Force Timeline Rebase" v03/branch-recovery-ui.js
          grep -q "rebaseCurrentChat(true)" v03/branch-recovery-ui.js
          grep -q "preserveLatestScannedMessage" v03/branches.js
          grep -q "startBranchRecoveryUi" bootstrap.js
          grep -q "Milestone minima are evidence invariants" v03/scanner.js
          ! grep -q "Math.min(tierCap, stockMinimum)" v03/scanner.js
          grep -q "rollbackRebasedRelationship" v03/branches.js
          grep -q "branchDivergenceMessageId" v03/branches.js
          grep -q "Relationship changes and milestone breakthroughs attributable to discarded branch messages are rolled back" v03/branch-recovery-ui.js
          grep -q "scannerNpcArrayValid" v03/scanner.js
          grep -q "scannerIdentityString" v03/scanner.js
          grep -q "preflightAutomaticIdentityPatches" v03/scanner.js
          grep -q "clauseAssertsNpcDeath" v03/scanner.js
          grep -q "affirmativeLivingReturnEvidence" v03/scanner.js
          grep -q "relationshipEvidencePolarityConflict" v03/relationship-evidence.js
          grep -q "nearestBefore" v03/relationship-evidence.js
          grep -q "relationshipSemanticGrounding" v03/relationship-evidence.js
          grep -q "semanticMentionsTarget" v03/relationship-evidence.js
          grep -q "TRUST_PERFORMANCE_FAILURE" v03/relationship-evidence.js
          grep -q "capped: change.delta" v03/scanner.js
          grep -q "latestManualRelationshipAnchors" v03/branches.js
          ! grep -q "manualProtectedAxes" v03/branches.js
          grep -q "ageProgressionBaselineAge" v03/schema.js
          grep -q "manualApparentAgeChanged" v03/engine.js
          grep -q "reconcileFamilyGraph: false" v03/engine.js
          grep -q "worldStateIdentityBridgesVisibleIntroduction" v03/scanner.js
          grep -q "newReferenceAllowedByWorldIdentityBridge" v03/scanner.js
          grep -q "IDENTITY BRIDGE" v03/evidence-adapter.js
          grep -q "normalizeRelationshipCaps" v03/schema.js
          grep -q "relationshipMechanicsPrompt(settings.relationshipCaps)" v03/injection.js
          grep -q "relationshipMechanicsPrompt(relationshipCaps)" v03/scanner.js
          grep -q "relationshipCaps: settings.relationshipCaps" v03/engine.js
          grep -q "OLDER CONTEXT — CONTINUITY ONLY; NOT NEW EVENT EVIDENCE" v03/scanner.js
          grep -q "visibleShortActivityIdentityMention" v03/scanner.js
          grep -q "shortActivityIdentityUnique" v03/scanner.js
          grep -q "ACTIVITY_SHORT_IDENTITY_STOP" v03/scanner.js
          grep -q '"version": "0.4.24"' manifest.json

      - name: Commit generated beta runtime
        run: |
          if git diff --quiet -- v03 bootstrap.js manifest.json package.json CHANGELOG.md README.md beta/verify-relationship-milestone-gates-0.4.1.mjs beta/verify-phase1-relationship-hardening-0.4.2.mjs beta/verify-phase7b-new-npc-history-enrichment-0.4.2.mjs beta/verify-phase7c-existing-relationship-evidence-grounding-0.4.3.mjs beta/verify-phase9-settings-categories-0.4.4.mjs beta/verify-phase12-relationship-recovery-0.4.7.mjs beta/verify-phase13-milestone-gate-invariants-0.4.8.mjs beta/verify-phase15-force-rebase-0.4.10.mjs beta/verify-phase16-scanner-edge-hardening-0.4.11.mjs beta/verify-phase17-second-order-hardening-0.4.12.mjs beta/verify-phase20-semantic-isolation-0.4.13.mjs beta/verify-phase21-release-source-parity-0.4.13.mjs beta/verify-phase22-settings-ui-cleanup-0.4.14.mjs beta/verify-phase24-release-source-parity-0.4.14.mjs beta/verify-phase28-relationship-semantic-grounding-0.4.16.mjs beta/verify-phase29-release-source-parity-0.4.16.mjs beta/verify-phase30-relationship-progression-0.4.17.mjs beta/verify-phase32-release-source-parity-0.4.17.mjs beta/verify-phase33-relationship-evaluation-observability-0.4.18.mjs beta/verify-phase35-release-source-parity-0.4.18.mjs beta/verify-phase36-per-axis-relationship-grounding-0.4.19.mjs beta/verify-phase38-release-source-parity-0.4.19.mjs beta/verify-phase39-relationship-evidence-contract-0.4.20.mjs beta/verify-phase41-release-source-parity-0.4.20.mjs beta/verify-phase42-relationship-history-remarks-0.4.21.mjs beta/verify-phase43-release-source-parity-0.4.21.mjs beta/verify-phase44-relationship-judgment-rubric-0.4.22.mjs beta/verify-phase45-release-source-parity-0.4.22.mjs; then
            echo "Generated beta runtime already matches build output."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v03 bootstrap.js manifest.json package.json CHANGELOG.md README.md beta/verify-relationship-milestone-gates-0.4.1.mjs beta/verify-phase1-relationship-hardening-0.4.2.mjs beta/verify-phase7b-new-npc-history-enrichment-0.4.2.mjs beta/verify-phase7c-existing-relationship-evidence-grounding-0.4.3.mjs beta/verify-phase9-settings-categories-0.4.4.mjs beta/verify-phase12-relationship-recovery-0.4.7.mjs beta/verify-phase13-milestone-gate-invariants-0.4.8.mjs beta/verify-phase15-force-rebase-0.4.10.mjs beta/verify-phase16-scanner-edge-hardening-0.4.11.mjs beta/verify-phase17-second-order-hardening-0.4.12.mjs beta/verify-phase20-semantic-isolation-0.4.13.mjs beta/verify-phase21-release-source-parity-0.4.13.mjs beta/verify-phase22-settings-ui-cleanup-0.4.14.mjs beta/verify-phase24-release-source-parity-0.4.14.mjs beta/verify-phase28-relationship-semantic-grounding-0.4.16.mjs beta/verify-phase29-release-source-parity-0.4.16.mjs beta/verify-phase30-relationship-progression-0.4.17.mjs beta/verify-phase32-release-source-parity-0.4.17.mjs beta/verify-phase33-relationship-evaluation-observability-0.4.18.mjs beta/verify-phase35-release-source-parity-0.4.18.mjs beta/verify-phase36-per-axis-relationship-grounding-0.4.19.mjs beta/verify-phase38-release-source-parity-0.4.19.mjs beta/verify-phase39-relationship-evidence-contract-0.4.20.mjs beta/verify-phase41-release-source-parity-0.4.20.mjs beta/verify-phase42-relationship-history-remarks-0.4.21.mjs beta/verify-phase43-release-source-parity-0.4.21.mjs beta/verify-phase44-relationship-judgment-rubric-0.4.22.mjs beta/verify-phase45-release-source-parity-0.4.22.mjs
          git commit -m "NPC State v0.4.24: fix short-name presence grounding"
          git push
