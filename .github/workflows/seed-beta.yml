name: Build NPC State 0.4 Beta

on:
  workflow_dispatch:
  push:
    paths:
      - beta/build-beta-v2.mjs
      - .github/workflows/seed-beta.yml

permissions:
  contents: write

jobs:
  build-beta:
    runs-on: ubuntu-latest
    steps:
      - name: Check out beta
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch stable NPC State baseline
        run: |
          rm -rf /tmp/npc-state-stable
          git clone --depth 1 https://github.com/kohz87/npc_state.git /tmp/npc-state-stable
          rm -rf v03
          cp -R /tmp/npc-state-stable/v03 ./v03
          cp /tmp/npc-state-stable/bootstrap.js ./bootstrap.js
          cp /tmp/npc-state-stable/manifest.json ./manifest.json
          cp /tmp/npc-state-stable/package.json ./package.json

      - name: Apply 0.4 beta transformation
        run: node beta/build-beta-v2.mjs

      - name: Syntax gate
        run: |
          node --check beta/build-beta-v2.mjs
          node --check bootstrap.js
          node --check v03/index.js
          node --check v03/engine.js
          node --check v03/injection.js
          node --check v03/foreground.js
          node --check v03/scanner.js
          node --check v03/storage.js

      - name: Foreground parser smoke test
        run: |
          node --input-type=module <<'EOF'
          import { consumeNpcStateControl } from './v03/foreground.js';
          const sample = 'Story text.\n\n<npc_state_v1>{"exchangeActiveNpcIds":[],"inChatNpcIds":[],"worldActiveNpcIds":[],"npcs":[],"socialEdges":[]}</npc_state_v1>\n\n<!-- INVENTORY_BLOCK_UPDATE {"mode":"patch","ops":[]} -->.';
          const result = consumeNpcStateControl(sample);
          if (!result.found || result.errors.length || !result.parsed) throw new Error('NPC foreground payload did not parse');
          if (!result.cleanedText.includes('INVENTORY_BLOCK_UPDATE')) throw new Error('NPC stripping consumed peer Inventory transport');
          if (result.cleanedText.includes('npc_state_v1')) throw new Error('NPC transport was not stripped');
          console.log('Foreground parser smoke test passed');
          EOF

      - name: Commit generated beta runtime
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md bootstrap.js manifest.json package.json v03
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "NPC State v0.4.0-beta.1: foreground embedded scan"
          git push
