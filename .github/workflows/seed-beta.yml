name: Build NPC State 0.4.44 Beta

on:
  workflow_dispatch:
  push:
    paths:
      - 'beta/*.mjs'
      - '.github/workflows/seed-beta.yml'
      - 'v03/**'
      - 'manifest.json'
      - 'package.json'
      - 'bootstrap.js'
      - 'README.md'
      - 'CHANGELOG.md'

permissions:
  contents: write

jobs:
  build-beta:
    runs-on: ubuntu-latest
    steps:
      - name: Check out beta
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Once CI has committed the regenerated v0.4.44 runtime, test that exact checkout
      # before replacing v03 from the pinned stable baseline. During the one-time transition
      # from the checked-in v0.4.43 runtime, the cold build generates v0.4.44 first.
      - name: Source checkout behavior gate
        run: |
          if grep -q '"version": "0.4.44"' manifest.json; then
            npm test
          else
            echo "Checked-in runtime predates v0.4.44; cold build will generate v0.4.44 first."
          fi

      - name: Fetch pinned stable NPC State baseline
        run: |
          rm -rf /tmp/npc-state-stable
          git clone https://github.com/kohz87/npc_state.git /tmp/npc-state-stable
          cd /tmp/npc-state-stable
          git checkout a12b2937b5c1305e3e3017218a626478a5bedcdc
          test "$(git rev-parse HEAD)" = "a12b2937b5c1305e3e3017218a626478a5bedcdc"
          cd "$GITHUB_WORKSPACE"
          rm -rf v03
          cp -R /tmp/npc-state-stable/v03 ./v03
          cp /tmp/npc-state-stable/bootstrap.js ./bootstrap.js
          cp /tmp/npc-state-stable/manifest.json ./manifest.json
          cp /tmp/npc-state-stable/package.json ./package.json

      - name: Apply 0.4.44 transformation in ordered phases
        run: |
          node beta/build-beta-v2.mjs
          node beta/post-build-patch.mjs
          node beta/harden-0.4.1.mjs
          node beta/fix-0.4.1-roster-copy.mjs
          node beta/fix-0.4.1-new-npc-bootstrap.mjs
          node beta/fix-0.4.1-first-run-stable-probe.mjs
          node beta/fix-0.4.1-key-relationship-shape.mjs
          node beta/fix-0.4.1-multi-npc-bootstrap.mjs
          node beta/fix-0.4.1-multi-npc-update.mjs
          node beta/fix-0.4.1-canonical-branch-fingerprint.mjs
          node beta/fix-0.4.1-deep-hardening.mjs
          node beta/fix-0.4.1-prelock-stale-embedded.mjs
          node beta/fix-0.4.1-missing-embedded-fallback.mjs
          node beta/fix-0.4.1-status-semantics.mjs
          node beta/fix-0.4.1-new-npc-id-authority.mjs
          node beta/fix-0.4.1-display-name-authority.mjs
          node beta/fix-0.4.1-age-semantics.mjs
          node beta/fix-0.4.1-form-aware-appearance.mjs
          node beta/fix-0.4.1-form-capture-semantics.mjs
          node beta/fix-0.4.1-form-baseline-recovery.mjs
          node beta/fix-0.4.1-relationship-milestone-gates.mjs

          # Replay every release transform in numeric patch order. The historical marker
          # comments below stay source-visible because descendant verifiers intentionally
          # assert that each older release remains part of the cold-build chain.
          for patch in $(seq 2 44); do
            node "beta/bump-0.4.${patch}.mjs"
            for phase in $(find beta -maxdepth 1 -name "phase*-0.4.${patch}.mjs" -print | sort); do
              echo "Applying $phase"
              node "$phase"
            done
          done

          # Historical source-parity markers retained for descendant verifier contracts.
          # node beta/bump-0.4.2.mjs ; -name 'phase*-0.4.2.mjs'
          # node beta/bump-0.4.3.mjs ; -name 'phase*-0.4.3.mjs'
          # node beta/bump-0.4.4.mjs ; -name 'phase*-0.4.4.mjs'
          # node beta/bump-0.4.5.mjs ; -name 'phase*-0.4.5.mjs'
          # node beta/bump-0.4.6.mjs ; -name 'phase*-0.4.6.mjs'
          # node beta/bump-0.4.7.mjs ; node beta/phase12-relationship-recovery-0.4.7.mjs ; -name 'phase*-0.4.7.mjs'
          # node beta/bump-0.4.8.mjs ; -name 'phase*-0.4.8.mjs'
          # node beta/bump-0.4.9.mjs ; -name 'phase*-0.4.9.mjs'
          # node beta/bump-0.4.10.mjs ; -name 'phase*-0.4.10.mjs'
          # node beta/bump-0.4.11.mjs ; -name 'phase*-0.4.11.mjs'
          # node beta/bump-0.4.12.mjs ; -name 'phase*-0.4.12.mjs'
          # node beta/bump-0.4.13.mjs ; -name 'phase*-0.4.13.mjs'
          # node beta/bump-0.4.14.mjs ; -name 'phase*-0.4.14.mjs'
          # node beta/bump-0.4.15.mjs ; -name 'phase*-0.4.15.mjs'
          # node beta/bump-0.4.16.mjs ; -name 'phase*-0.4.16.mjs'
          # node beta/bump-0.4.17.mjs ; -name 'phase*-0.4.17.mjs'
          # node beta/bump-0.4.18.mjs ; -name 'phase*-0.4.18.mjs'
          # node beta/bump-0.4.19.mjs ; -name 'phase*-0.4.19.mjs'
          # node beta/bump-0.4.20.mjs ; -name 'phase*-0.4.20.mjs'
          # node beta/bump-0.4.21.mjs ; -name 'phase*-0.4.21.mjs'
          # node beta/bump-0.4.22.mjs ; -name 'phase*-0.4.22.mjs'
          # node beta/bump-0.4.23.mjs ; -name 'phase*-0.4.23.mjs'
          # node beta/bump-0.4.24.mjs ; -name 'phase*-0.4.24.mjs'
          # node beta/bump-0.4.25.mjs ; -name 'phase*-0.4.25.mjs'
          # node beta/bump-0.4.26.mjs ; -name 'phase*-0.4.26.mjs'
          # node beta/bump-0.4.27.mjs ; -name 'phase*-0.4.27.mjs'
          # node beta/bump-0.4.28.mjs ; -name 'phase*-0.4.28.mjs'
          # node beta/bump-0.4.29.mjs ; -name 'phase*-0.4.29.mjs'
          # node beta/bump-0.4.30.mjs ; -name 'phase*-0.4.30.mjs'
          # node beta/bump-0.4.31.mjs ; -name 'phase*-0.4.31.mjs'
          # node beta/bump-0.4.32.mjs ; -name 'phase*-0.4.32.mjs'
          # node beta/bump-0.4.33.mjs ; -name 'phase*-0.4.33.mjs'
          # node beta/bump-0.4.34.mjs ; -name 'phase*-0.4.34.mjs'
          # node beta/bump-0.4.35.mjs ; -name 'phase*-0.4.35.mjs'
          # node beta/bump-0.4.36.mjs ; -name 'phase*-0.4.36.mjs'
          # node beta/bump-0.4.37.mjs ; -name 'phase*-0.4.37.mjs'
          # node beta/bump-0.4.38.mjs ; -name 'phase*-0.4.38.mjs'
          # node beta/bump-0.4.39.mjs ; -name 'phase*-0.4.39.mjs'
          # node beta/bump-0.4.40.mjs ; -name 'phase*-0.4.40.mjs'
          # node beta/bump-0.4.41.mjs ; -name 'phase*-0.4.41.mjs'
          # node beta/bump-0.4.42.mjs ; -name 'phase*-0.4.42.mjs'
          # node beta/bump-0.4.43.mjs ; -name 'phase*-0.4.43.mjs'
          # node beta/bump-0.4.44.mjs ; -name 'phase*-0.4.44.mjs'

      - name: Syntax gate
        run: |
          find beta -maxdepth 1 -name '*.mjs' -print0 | sort -z | xargs -0 -n1 node --check
          find v03 -maxdepth 1 -name '*.js' -print0 | sort -z | xargs -0 -n1 node --check
          node --check bootstrap.js

      - name: Consolidated behavior gate
        run: npm test

      - name: Architecture and migration gate
        run: |
          test ! -e beta/build-beta.mjs
          grep -q "getStablePointer" v03/engine.js
          grep -q "extension_settings?.npc_state?.v3?.dataFiles" v03/index.js
          grep -q "Optional stable v0.3 import pointer is stale; starting a fresh beta database" v03/engine.js
          grep -q "NPC_STATE_V04_BETA_MISSING_SIDECAR" v03/engine.js
          test ! -e v03/migrate-v02.js
          ! grep -q "readLegacyV02Sidecar" v03/engine.js
          ! grep -q "getLegacyPointer" v03/index.js
          grep -q "fallbackScan: false" v03/index.js
          grep -q "Malformed capture recovery" v03/ui.js
          grep -q "foreground-missing-control" v03/index.js
          ! grep -q "maybeForegroundFallback(id, 'missing-control')" v03/index.js
          grep -q "A single scan may introduce MULTIPLE new individually relevant NPCs" v03/injection.js
          grep -q "A single scan may update MULTIPLE existing NPCs" v03/injection.js
          grep -q "KeyRelationships entries MUST be strings, never objects" v03/injection.js
          grep -q "normalizeCurrentStatus" v03/schema.js
          grep -q "Never invent an npc-\* id" v03/injection.js
          grep -q "npcs.name is human-facing display text" v03/injection.js
          grep -q "function isTechnicalNpcIdentity" v03/scanner.js
          grep -q "function canonicalPatchName" v03/scanner.js
          grep -q "normalizeActualAge" v03/schema.js
          grep -q "normalizeAppearanceForms" v03/schema.js
          grep -q "RELATIONSHIP_MILESTONE_THRESHOLDS" v03/schema.js
          grep -q "relationshipMilestoneUnlocked" v03/scanner.js
          grep -q "RELATIONSHIP REPEATS AND GATES" v03/injection.js
          grep -q "relationshipProgress" v03/schema.js
          grep -q "relationshipEvidenceHistory" v03/schema.js
          grep -q "relationshipInertiaFactor" v03/scanner.js
          grep -q "if (magnitude <= 25) return 1;" v03/scanner.js
          grep -q "selectRelationshipAxes(delta, axisLimit, priority = \[\])" v03/scanner.js
          grep -q "relationshipSummarySupported" v03/scanner.js
          grep -q "relationshipContextForExchange" v03/engine.js
          grep -q "relationshipEvidenceExcerptMatch" v03/relationship-evidence.js
          grep -q "relationshipSources" v03/evidence-adapter.js
          grep -q "relationshipSemanticGrounding" v03/relationship-evidence.js
          grep -q "relationshipEvaluationDiagnostic" v03/scanner.js
          grep -q "evaluated-no-change" v03/scanner.js
          grep -q "relationshipJudgmentRubricPrompt" v03/relationship-policy.js
          grep -q "LEGACY_DEFAULT_RELATIONSHIP_CRITERIA_V0421" v03/index.js
          grep -q "function relationshipAxisProvenance" v03/scanner.js
          grep -q "function relationshipAxisLooksDuplicate" v03/scanner.js
          grep -q "function relationshipDuplicateEvidenceKey" v03/scanner.js
          ! grep -q "DESIRE_EVIDENCE_CUES" v03/scanner.js
          ! grep -q "relationshipEvidenceGrounding(" v03/scanner.js
          ! grep -q "relationshipEvidencePolarityConflict(" v03/scanner.js
          grep -q "relationshipHistoryRemarkHtml" v03/dossier-view.js
          grep -q "relationshipHistoryRecoveredAxisEvidence" v03/dossier-view.js
          grep -q "No explanation recorded." v03/dossier-view.js
          grep -q "const siblingLimit = 4" v03/branches.js
          grep -q "preserveLatestScannedMessage" v03/branches.js
          grep -q "rollbackRebasedRelationship" v03/branches.js
          grep -q "branchDivergenceMessageId" v03/branches.js
          grep -q "scannerNpcArrayValid" v03/scanner.js
          grep -q "preflightAutomaticIdentityPatches" v03/scanner.js
          ! grep -q "clauseAssertsNpcDeath" v03/scanner.js
          ! grep -q "affirmativeLivingReturnEvidence" v03/scanner.js
          grep -q "latestManualRelationshipAnchors" v03/branches.js
          ! grep -q "manualProtectedAxes" v03/branches.js
          grep -q "ageProgressionBaselineAge" v03/schema.js
          grep -q "manualApparentAgeChanged" v03/engine.js
          grep -q "reconcileFamilyGraph: false" v03/engine.js
          grep -q "worldStateIdentityBridgesVisibleIntroduction" v03/scanner.js
          grep -q "newReferenceAllowedByWorldIdentityBridge" v03/scanner.js
          grep -q "IDENTITY BRIDGE" v03/evidence-adapter.js
          grep -q "normalizeRelationshipCaps" v03/schema.js
          grep -q "OLDER CONTEXT — CONTINUITY ONLY; NOT NEW EVENT EVIDENCE" v03/scanner.js
          grep -q "visibleShortActivityIdentityMention" v03/scanner.js
          grep -q "shortActivityIdentityUnique" v03/scanner.js
          grep -q "groundedFamilyMemberNames" v03/scanner.js
          grep -q "projectFamilySlotMembers" v03/scanner.js
          grep -q "memberNames" v03/schema.js
          grep -q "FAMILY_KINSHIP_GROUPS" v03/scanner.js
          grep -q "reciprocalFamilyRelation" v03/scanner.js
          grep -q "resolveFamilySlotMember" v03/scanner.js
          grep -q "upsertFamilyRelationship" v03/scanner.js
          grep -q "splitWorldStatePresenceSections" v03/evidence-adapter.js
          grep -q "identityPresencePromptRules" v03/evidence-adapter.js
          grep -q "identityEvidenceVerified" v03/scanner.js
          grep -q "activityEvidenceVerified" v03/scanner.js
          grep -q "filter(id => !presentIds.includes(id))" v03/scanner.js
          grep -q "Persistent NPC State 0.4." v03/ui.js

          # v0.4.28 recovery/rebuild invariants.
          grep -q "normalizeRecoveryState" v03/schema.js
          grep -q "copy.recovery = null" v03/schema.js
          grep -q "createRecoveryV3Sidecar" v03/storage.js
          grep -q "NPC_STATE_V04_BETA_RECOVERY_SOURCE_EXISTS" v03/storage.js
          grep -q "startHistoricalRecovery" v03/engine.js
          grep -q "resumeHistoricalRecovery" v03/engine.js
          grep -q "historicalChat = liveChat.slice(0, nextMessageId + 1)" v03/engine.js
          grep -q "relationshipMode === 're-evaluate'" v03/engine.js
          grep -q "staleDeleteAfter: 1000000000" v03/engine.js
          grep -q "recoveryBlocksLiveScan" v03/engine.js
          grep -q "recoveryPending" v03/index.js
          grep -q "initializeFresh: options => engine.initializeFresh" v03/index.js
          grep -q "RECOVERY_REBUILD_UI_VERSION" v03/branch-recovery-ui.js
          grep -q "Rebase to current chat" v03/branch-recovery-ui.js
          grep -q "Force Timeline Rebase" v03/branch-recovery-ui.js
          grep -q "startBranchRecoveryUi" bootstrap.js

          # v0.4.29 interruption/concurrency and event-dedupe invariants.
          grep -q "ownerSessionId" v03/schema.js
          grep -q "leaseUntil" v03/schema.js
          grep -q "recoveryOwnedElsewhere" v03/engine.js
          grep -q "pauseRecoveryForChatSwitchUnlocked" v03/engine.js
          grep -q "chat-switched-before-plan" v03/engine.js
          grep -q "recovery-lease-lost" v03/engine.js
          grep -q "sourceEventKey" v03/schema.js
          grep -q "relationshipSourceEventKey" v03/scanner.js
          ! grep -q "previousEvidence && previousEvidence === currentEvidence" v03/scanner.js
          grep -q "Recovery start message is outside the current chat" v03/engine.js
          grep -q "recoveryRange: options => engine.recoveryRange(options)" v03/index.js
          test "$(grep -c "function recoveryRange" v03/engine.js)" -eq 1
          ! grep -q "function recoveryRange() {" v03/engine.js
          grep -q "npc-state-v0429-selected-count" v03/branch-recovery-ui.js
          grep -q "active in another tab" v03/branch-recovery-ui.js

          # v0.4.30 safe timeline rebase relationship-mode invariants.
          grep -q "normalizeRebaseRelationshipMode" v03/branches.js
          grep -q "previewRelationshipRebase" v03/branches.js
          grep -q "relationshipMode = 'preserve'" v03/engine.js
          grep -q "applyRelationship: rebase && mode === 'preserve' ? false : null" v03/engine.js
          grep -q "rebaseBackup" v03/schema.js
          grep -q "Keep NPC state and accept timeline" v03/branch-recovery-ui.js
          grep -q "Roll back discarded story changes" v03/branch-recovery-ui.js

          # v0.4.31 rebase state and operation-boundary invariants.
          grep -q "relationshipReplayBoundary" v03/schema.js
          grep -q "relationshipReplayProtected" v03/engine.js
          grep -q "chatChanged('after-queue')" v03/engine.js
          grep -q "preview-after-load" v03/engine.js
          grep -q "persistenceFailed: Boolean(persistenceError)" v03/engine.js
          grep -q "restored.rebaseBackup = structuredClone(normalized.rebaseBackup || null)" v03/branches.js

          # v0.4.32 queued mutation ownership and rollback replay continuity invariants.
          grep -q "chatChanged('mutation-after-queue')" v03/engine.js
          grep -q "chatChanged('mutation-after-load')" v03/engine.js
          grep -q "chatChanged('mutation-before-apply')" v03/engine.js
          grep -q "chatChanged('mutation-before-persist')" v03/engine.js
          grep -q "const result = await mutator(state, chat);" v03/engine.js
          grep -q "retainValidRelationshipReplayBoundary" v03/branches.js

          # v0.4.33 grounded semantic life-state and death-transition invariants.
          grep -q "applyConfirmedDeathTransition" v03/schema.js
          grep -q "normalizeLifeStateDiagnostics" v03/schema.js
          grep -q "lifeStateEvidenceGrounded" v03/scanner.js
          grep -q "applyManualLifeStateTransition" v03/engine.js
          grep -q "living-return-required" v03/scanner.js
          ! grep -q "AFFIRMATIVE_DEATH_CUE" v03/scanner.js
          ! grep -q "clauseAssertsNpcDeath" v03/scanner.js
          ! grep -q "affirmativeDeathEvidence" v03/scanner.js
          ! grep -q "affirmativeLivingReturnEvidence" v03/scanner.js

          # v0.4.34 terminal-status lifecycle reconciliation invariants.
          grep -q "lifeStateEvidenceMatchesStoredStatus" v03/scanner.js
          grep -q "storedStatusDeathRepair" v03/scanner.js
          grep -q "storedStatus: storedStatusBeforePatch" v03/scanner.js
          grep -q "STORED TERMINAL-STATUS RECONCILIATION" v03/scanner.js
          grep -q "STORED TERMINAL-STATUS RECONCILIATION" v03/injection.js
          grep -q "WORLD-ACTIVE CONSISTENCY" v03/injection.js
          grep -q "field('Life state', npc.lifeState)" v03/injection.js

          # v0.4.35 responsive Advanced Recovery controls.
          grep -q "PHASE72_RESPONSIVE_RECOVERY_CONTROLS" v03/branch-recovery-ui.js
          grep -q "grid-template-columns:repeat(2,minmax(0,1fr))" v03/branch-recovery-ui.js
          grep -q "white-space:normal!important" v03/branch-recovery-ui.js
          grep -q "@media(max-width:720px)" v03/branch-recovery-ui.js

          # v0.4.36 lifecycle reconciliation and manual recovery invariants.
          grep -q "lifeStateUpdates" v03/scanner.js
          grep -q "lifeStateUpdateByNpcId" v03/scanner.js
          grep -q "LIFE-STATE UPDATE CHANNEL" v03/scanner.js
          grep -q "applyManualLifeStateTransition" v03/schema.js
          grep -q "applyManualLifeStateTransition" v03/engine.js
          grep -q "parsedRaw.lifeStateUpdates" v03/engine.js
          grep -q "lifeStateUpdates" v03/injection.js
          grep -q "npc_state_v3_edit_life_state" v03/ui.js
          grep -q "npc_state_v3_edit_life_state_reason" v03/ui.js

          # v0.4.37 dossier diagnostics visibility and lighter library rendering.
          grep -q "showDossierDiagnostics: false" v03/index.js
          grep -q "settings.showDossierDiagnostics = settings.showDossierDiagnostics === true" v03/index.js
          grep -q "npc_state_v3_show_diagnostics" v03/ui.js
          grep -q "npc-state-v3-toggle-diagnostics" v03/ui.js
          grep -q "dossierHtml(npc, { showDiagnostics })" v03/ui.js
          grep -q "dossierHtml(npc, { showDiagnostics = false } = {})" v03/dossier-view.js
          grep -q "showDiagnostics ? block('Life-state diagnostics'" v03/dossier-view.js
          grep -q "showDiagnostics ? block('Relationship evaluation & scoring'" v03/dossier-view.js

          # v0.4.38 dossier rendering performance invariants.
          grep -q "hydrateVisibleCastPortraits" v03/ui.js
          grep -q "scheduleLibraryRailRender" v03/ui.js
          grep -q "detailOnly = false" v03/ui.js
          grep -q "npc-state-v3-deferred-portrait" v03/dossier-view.js
          grep -q "deferSource: true" v03/dossier-view.js
          grep -q "backdrop-filter:none" v03/style.css
          ! grep -q "backdrop-filter:blur(3px)" v03/style.css
          grep -q "PHASE78_DOSSIER_RENDERING_PERFORMANCE" v03/style.css

          # v0.4.39 dossier state-projection performance invariants.
          grep -q "PHASE80_DOSSIER_STATE_PROJECTION" v03/engine.js
          grep -q "dossierIndexProjection" v03/engine.js
          grep -q "getDossierIndex" v03/engine.js
          grep -q "getDossierNpc" v03/engine.js
          grep -q "getNpcPortraitSource" v03/engine.js
          grep -q "portraitAvailable" v03/dossier-view.js
          grep -q "engine.getDossierIndex(getChatKey())" v03/ui.js
          grep -q "engine.getDossierNpc(reference, getChatKey())" v03/ui.js
          grep -q "engine.getNpcPortraitSource" v03/ui.js
          ! grep -q "engine.getState(" v03/ui.js

          # v0.4.40 foreground hot-path projection and refresh invariants.
          grep -q "PHASE82_FOREGROUND_HOT_PATH_PROJECTION" v03/engine.js
          grep -q "injectionStateProjection" v03/engine.js
          grep -q "getInjectionState" v03/engine.js
          grep -q "stateChangeSnapshot ? structuredClone(state) : null" v03/engine.js
          grep -q "engine.getInjectionState(key)" v03/index.js
          grep -q "stateChangeSnapshot: false" v03/index.js
          grep -q "inlineRosterSignature" v03/ui.js
          grep -q "existing?.dataset.signature === signature" v03/ui.js
          ! grep -q "const state = key === 'no-chat' ? null : engine.getState(key);" v03/index.js

          # v0.4.41 settings observer and recovery UI hot-path invariants.
          grep -q "PHASE84_SETTINGS_OBSERVER_RECOVERY_HOTPATH" v03/settings-layout.js
          grep -q "setTextIfChanged(label, 'Relationship Rubric')" v03/settings-layout.js
          grep -q "setTextIfChanged(label, 'Memory Rubric')" v03/settings-layout.js
          grep -q "function branchSafetyStatus(chatKey = getChatKey())" v03/engine.js
          grep -q "branchSafetyStatus: () => engine.branchSafetyStatus(getChatKey())" v03/index.js
          grep -q "readRecoveryStatus" v03/branch-recovery-ui.js
          ! grep -q "NPCState?.getState?.()" v03/branch-recovery-ui.js
          ! grep -q "state()?.recovery" v03/branch-recovery-ui.js
          grep -Eq '"version": "0\.4\.(41|42|43|44)"' manifest.json

          # v0.4.42 alternate scan connection and same-exchange completeness invariants.
          grep -q "PHASE86_ALTERNATE_SCAN_PROFILE_COMPLETENESS" v03/scanner.js
          grep -q "ConnectionManagerRequestService" v03/scan-connection.js
          grep -q "service.sendRequest" v03/scan-connection.js
          grep -q "scanConnectionProfileId: ''" v03/index.js
          grep -q "scanAfterEachResponse: false" v03/index.js
          grep -q "processCompletedAssistantResponse(messageId)" v03/index.js
          grep -q "npc_state_beta_completion_v1" v03/index.js
          grep -q "buildCompletenessPrompt" v03/scanner.js
          grep -q "async function completenessScan" v03/engine.js
          grep -q "supplementalPass: true" v03/engine.js
          grep -q "invalidateCompleteness" v03/engine.js
          grep -q "resolveGenerationRoute" v03/engine.js
