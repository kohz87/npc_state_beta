name: NPC State Stage v0.5.20

on:
  push:
    branches:
      - fix/v0.5.20-first-pass-sufficiency
    paths:
      - '.github/workflows/stage-v0520.yml'

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: fix/v0.5.20-first-pass-sufficiency
          fetch-depth: 0
      - name: Apply exact reviewed v0.5.20 patch
        shell: bash
        run: |
          cat .npc-state-v0520.part-00 .npc-state-v0520.part-01 .npc-state-v0520.part-02 .npc-state-v0520.p03-00 .npc-state-v0520.p03-01 .npc-state-v0520.p04-00 .npc-state-v0520.p04-01 > /tmp/v0520.patch.gz.b64
          echo "daec921faba0e1a7f39bd9bc314e59119833d2e6efc0689e0b37aabc272aeb72  /tmp/v0520.patch.gz.b64" | sha256sum -c -
          base64 -d /tmp/v0520.patch.gz.b64 | gzip -d > /tmp/v0520.patch
          echo "f2d2a0ac6ba0df7e68a9287e5fe3b97f4d487dca9a53afe405fd732f56ffd7ff  /tmp/v0520.patch" | sha256sum -c -
          git apply --check /tmp/v0520.patch
          git apply /tmp/v0520.patch
          rm -f .npc-state-v0520.part-00 .npc-state-v0520.part-01 .npc-state-v0520.part-02 .npc-state-v0520.p03-00 .npc-state-v0520.p03-01 .npc-state-v0520.p04-00 .npc-state-v0520.p04-01
          rm .github/workflows/stage-v0520.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: strengthen first-pass scanner calibration for v0.5.20"
          git push origin HEAD:fix/v0.5.20-first-pass-sufficiency
