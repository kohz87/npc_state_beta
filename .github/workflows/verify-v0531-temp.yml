name: v0.5.31 temporary verification

on:
  push:
    branches:
      - fix/v0531-live-evidence-birthday-provenance

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Synchronize runtime release label
        run: sed -i "s/export const NPC_STATE_VERSION = '0.5.30'/export const NPC_STATE_VERSION = '0.5.31'/" src/schema.js
      - name: Apply candidate patch
        run: node scripts/v0531-patch-temp.mjs
      - name: Compact prompt and synchronize release test
        run: |
          sed -i 's@PRIVATE COMPLETENESS CHECK: re-check every field + Current Dynamic against permitted CURRENT sources before payload; directly supported narrow values are proposals, not insufficient. Unknown is valid; never invent.@PRIVATE COMPLETENESS CHECK: directly supported values from permitted CURRENT sources are proposals, not insufficient. Unknown is valid; never invent.@' src/scan-helpers.js
          sed -i 's@; birthdayProvenance:"generated" is fallback metadata, not evidence\.@.@' src/model/semantic-updates.js
          sed -i "s/assert.equal(manifest.version, '0.5.30');/assert.equal(manifest.version, '0.5.31');/" tests/structure.test.mjs
          sed -i "s/NPC_STATE_VERSION = '0.5.30'/NPC_STATE_VERSION = '0.5.31'/" tests/structure.test.mjs
      - name: Diff sanity
        run: |
          git diff --check
          git status --short
      - name: Validate
        run: npm run validate
      - name: Tests
        run: npm test
      - name: Package
        run: npm run package
      - name: Measure scanner prompts
        run: npm run measure:scan-prompts
      - name: Commit verified candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release v0.5.31 live evidence and birthday provenance"
          git push origin HEAD:fix/v0531-live-evidence-birthday-provenance
