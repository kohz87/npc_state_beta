name: v0.7.5 lean identity cleanup verification

on:
  push:
    branches:
      - automation/v075-identity-handoff
    paths:
      - 'scripts/apply-v075-polish.py'
      - '.github/workflows/v075-polish-verify.yml'

permissions:
  contents: write

jobs:
  patch-verify-commit:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out candidate branch
        uses: actions/checkout@v4
        with:
          ref: automation/v075-identity-handoff
          fetch-depth: 0
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply cleanup
        run: python3 scripts/apply-v075-polish.py
      - name: Validate authoritative source
        run: npm run validate
      - name: Run regression tests
        run: npm test
      - name: Package extension
        run: npm run package
      - name: Inspect package and diff
        run: |
          unzip -l dist/*.zip
          git diff --stat 1d28c4f434f27097cb3eaefcfbc35b3510036e50
          git diff --check
      - name: Commit verified cleanup
        run: |
          rm scripts/apply-v075-polish.py
          rm .github/workflows/v075-polish-verify.yml
          git config user.name "OpenAI automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          test ! -e scripts/apply-v075-polish.py
          test ! -e .github/workflows/v075-polish-verify.yml
          git diff --cached --check
          git commit -m "test: harden first-pass identity handoff coverage"
          git push origin HEAD:automation/v075-identity-handoff
