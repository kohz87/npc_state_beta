name: v0710 review cycle 1

on:
  push:
    branches: [automation/v0710-work]
    paths: ['.github/workflows/v0710-apply.yml']

permissions:
  contents: write

jobs:
  review-fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply cycle 1 finding
        run: |
          base64 -d .staging/v0710/cycle1.patch.gz.b64 | gzip -d > /tmp/cycle1.patch
          git checkout --detach c0a58c0d3611dfe2892451220bb413420dbca583
          git apply --index /tmp/cycle1.patch
      - name: Verify cycle 1
        run: |
          node --test tests/v0710-first-pass-completeness.test.mjs tests/v075-identity-handoff.test.mjs tests/v077-output-contract.test.mjs tests/v077-host-capture.test.mjs
          npm run validate
          npm test
          npm run package
          unzip -t dist/npc_state_beta-0.7.10.zip
          git diff --cached --check
      - name: Commit cycle 1 fix
        run: |
          git config user.name 'OpenAI automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: harden natural relationship target resolution' -m 'Review cycle 1 found that single-quoted dialogue could masquerade as narrator-addressed second person and that an ambiguous stored alias could bypass uniqueness checks. Strip supported single-quoted dialogue without breaking possessive apostrophes and apply ambiguity checks to full labels as well as short candidates.'
          git push origin HEAD:refs/heads/automation/v0710-candidate
