name: v0710 initial candidate

on:
  push:
    branches: [automation/v0710-work]
    paths: ['.github/workflows/v0710-apply.yml']

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply exact reviewed patch
        run: |
          base64 -d .staging/v0710/initial.patch.gz.b64 | gzip -d > /tmp/v0710.patch
          git checkout --detach 0386c6b8b16d5fc196a8f0e921ca766fed72cfea
          git apply --index /tmp/v0710.patch
      - name: Run initial implementation gates
        run: |
          npm run validate
          npm test
          npm run package
          unzip -t dist/npc_state_beta-0.7.10.zip
          if unzip -Z1 dist/npc_state_beta-0.7.10.zip | grep -E '(^|/)(tests|scripts|\.github)(/|$)|review-ledger'; then
            echo 'Development-only content leaked into package' >&2
            exit 1
          fi
          git diff --cached --check
      - name: Commit initial implementation
        run: |
          git config user.name 'OpenAI automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: complete first-pass dossier accounting' -m 'Release v0.7.10 initial implementation. Ground zero-delta Current Dynamic through unambiguous short-name and narrator-addressed evidence, make field-level completeness honest while preserving legacy group labels, and route bootstrap collections through field-specific normalization. Strengthen the compact same-generation first-pass contract without adding another model request.'
          git push origin HEAD:refs/heads/automation/v0710-candidate

# second registration push for branch-only staging workflow
