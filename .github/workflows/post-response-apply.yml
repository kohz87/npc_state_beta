name: post-response apply

on:
  push:
    branches:
      - automation/post-response-apply

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'

      - name: Reconstruct verified patches
        shell: bash
        run: |
          set -euo pipefail
          cat .staging/post-response/xzpart* | base64 -d | xz -d > /tmp/impl.patch
          base64 -d .staging/post-response/review.patch.gz.b64 | gzip -d > /tmp/review.patch
          echo '8411c44904c9a20c00b4ab4447344001171469b93235dc97178f613d6ae983ec  /tmp/impl.patch' | sha256sum -c -
          echo '4e31844ac4862e7f9a7c8c0275ef148bcd868b774d01b70a966c7ab5eabef74e  /tmp/review.patch' | sha256sum -c -

      - name: Create clean implementation commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'OpenAI Automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git reset --hard c0a58c0d3611dfe2892451220bb413420dbca583
          git apply --check /tmp/impl.patch
          git apply /tmp/impl.patch
          git diff --check
          npm run validate
          npm test
          npm run package
          unzip -t dist/npc_state_beta-0.5.11.zip
          git add -A
          git diff --cached --check
          git commit -m 'refactor: move automatic extraction post-response' -m 'Replace embedded foreground extraction, automatic fallback, and supplemental completeness with one dedicated post-response Scan while retaining the shared scanner/application, v0.7.10 validation fixes, guarded persistence, rollback/recovery, and storage compatibility. Reset only the public release presentation to 0.5.11; persisted schemas and npc_state_beta.v3 remain unchanged.'
          echo "IMPL_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Apply and validate review fix
        shell: bash
        run: |
          set -euo pipefail
          git apply --check /tmp/review.patch
          git apply /tmp/review.patch
          rm -f docs/review-ledger-v0.5.11.md
          node --test tests/post-response-rework.test.mjs
          node --test tests/branch-history.test.mjs tests/recovery-regressions.test.mjs tests/operation-ownership.test.mjs tests/engine-persistence-race.test.mjs || true
          npm run validate
          npm test
          npm run package
          unzip -t dist/npc_state_beta-0.5.11.zip
          git diff --check
          git add -A
          git diff --cached --check
          git commit -m 'fix: bound post-response coordinator ownership' -m 'Retire stale post-response jobs explicitly, abort superseded revisions and cleared-chat work through the existing AbortController, keep compact immutable source descriptors, and prevent delayed older completion events from replaying after a newer assistant boundary.'
          echo "REVIEW_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Record real review lineage
        shell: bash
        run: |
          set -euo pipefail
          cat > docs/review-ledger-v0.5.11.md <<EOF
          # v0.5.11 implementation review ledger

          \`docs/core-contract.md\` remains authoritative. This development-only ledger is excluded from the installable package. Tests use controlled host/storage/model fixtures and never access or rebuild a user NPC State database.

          ## Implementation candidate

          Candidate: \`${IMPL_SHA}\`.

          Scope implemented: replace embedded foreground extraction/fallback/completeness with one dedicated post-response Scan; continuity-only foreground injection; awaited next-generation synchronization through SillyTavern \`generate_interceptor\`; exact source ownership captured before async waits; bounded current-exchange scanner context; retained 0.7.10 collection/field-accounting/Current-Dynamic fixes; settings migration; release presentation reset to 0.5.11 without changing storage identity/schema.

          Validation before review: \`npm run validate\`, \`npm test\`, \`npm run package\`, and ZIP integrity passed with 282/282 tests, 81 JavaScript files, and 55 packaged files. Same 60-NPC/Bessa fixture: foreground extraction instruction overhead changed from 4,702 chars / ~1,350 local-estimate tokens to 621 chars / ~178 while selected dossiers increased from 1 to 6 under the same 1,800-token budget; routine Scan changed from 133,394 chars / ~38,125 local-estimate tokens to 31,832 chars / ~9,108.

          ## Post-implementation review

          Reviewed SHA: \`${IMPL_SHA}\`.

          Inspected: automatic extraction and scan context (\`src/scan-prompts.js\`, scanner/application/evidence boundaries); asynchronous lifecycle (\`src/index.js\`, \`src/post-response-coordinator.js\`, \`src/engine.js\`, \`src/shared-generation-queue.js\`); rollback/recovery and manual ownership; settings/data compatibility; legacy transport canonicalization; public diagnostics/API compatibility; package reachability and retired-path references.

          Concrete hypotheses/probes: delayed duplicate completion for an older source after a newer assistant boundary; same-position revised/swiped source while the older provider request is in flight; chat switch/clear while a scan is in flight; next-turn synchronization, timeout/retry and scanner-recursion behavior; exact-checkpoint deletion, manual-correction rollback and recovery persistence; schema-1/settings migration, alternate routing, parser/semantic contract and package loading; source search for retired embedded/completeness runtime consumers.

          Confirmed finding: the coordinator retained every completed job indefinitely, and source descriptors retained host context/message references. \`clearChat()\` removed status but did not abort/retire those jobs, so switched-away scans could continue consuming provider work until engine ownership eventually discarded them. Retaining old completed jobs also served as accidental replay suppression rather than an explicit bounded policy.

          Fix commit: \`${REVIEW_SHA}\`. Keep compact immutable source descriptors; track the newest assistant boundary per chat; ignore delayed older completion events; abort superseded same-position revisions through the existing per-job \`AbortController\`; retire non-current settled jobs; abort/delete all jobs for a cleared chat; preserve the newest completed result for duplicate events. No second cancellation system was added.

          Focused verification after the fix: 14/14 post-response rework tests, 42/42 asynchronous/rollback/recovery tests, and 52/52 contract/settings/package-consumer tests passed locally before publication. The exact reviewed tree also passes the full repository validation/test/package gates.

          Remaining limitation: no authorized live SillyTavern/provider setup or exact configured provider/model identifier corresponding to the user label “Gemini 3.8 Flash” was available, so live sample count is 0. Deterministic tests do not measure provider output reliability.
          EOF
          git add docs/review-ledger-v0.5.11.md
          git diff --cached --check
          git commit -m 'docs: record v0.5.11 post-response review'
          echo "FINAL_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Final release verification
        shell: bash
        run: |
          set -euo pipefail
          npm run validate
          npm test
          npm run package
          unzip -t dist/npc_state_beta-0.5.11.zip
          test -z "$(git status --porcelain)"
          test ! -e .staging
          test ! -e .github/workflows/post-response-apply.yml
          count=$(unzip -Z1 dist/npc_state_beta-0.5.11.zip | wc -l | tr -d ' ')
          test "$count" = '55'
          if unzip -Z1 dist/npc_state_beta-0.5.11.zip | grep -Eq '(^|/)(tests|scripts|docs|\.github)(/|$)'; then
            echo 'Development files leaked into package' >&2
            exit 1
          fi
          echo "Implementation: ${IMPL_SHA}"
          echo "Review fix: ${REVIEW_SHA}"
          echo "Final: $(git rev-parse HEAD)"
          sha256sum dist/npc_state_beta-0.5.11.zip

      - name: Publish clean candidate branch
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:refs/heads/automation/post-response-candidate

      - uses: actions/upload-artifact@v4
        with:
          name: npc-state-0.5.11-reviewed-candidate
          path: dist/npc_state_beta-0.5.11.zip
          if-no-files-found: error
