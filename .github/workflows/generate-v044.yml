name: Generate NPC State 0.4.44 runtime

on:
  push:
    branches:
      - 'fix/v0.4.44-durable-important-memories'
    paths:
      - 'beta/*0.4.44.mjs'
      - '.github/workflows/generate-v044.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply v0.4.44 release transforms to checked-in v0.4.43 runtime
        run: |
          node beta/bump-0.4.44.mjs
          for phase in $(find beta -maxdepth 1 -name 'phase*-0.4.44.mjs' -print | sort); do
            echo "Applying $phase"
            node "$phase"
          done

      - name: Syntax gate
        run: |
          find beta -maxdepth 1 -name '*.mjs' -print0 | sort -z | xargs -0 -n1 node --check
          find v03 -maxdepth 1 -name '*.js' -print0 | sort -z | xargs -0 -n1 node --check
          node --check bootstrap.js

      - name: Behavior gate
        run: npm test

      - name: Commit generated v0.4.44 runtime
        run: |
          rm -f .github/workflows/generate-v044.yml
          if git diff --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "NPC State v0.4.44: preserve durable Important Memories"
          git push
