name: v0.7.3 remediation follow-up verification

on:
  workflow_dispatch:
  push:
    branches:
      - automation/v073-correction-remediation

permissions:
  contents: write

jobs:
  patch-verify-commit:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out candidate branch
        uses: actions/checkout@v4
        with:
          ref: automation/v073-correction-remediation
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Repair follow-up staging harness
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/apply-v073-followup.py')
          text = path.read_text()
          needle = "    \"import { manualRelationshipRemediationPatch } from '../src/ui.js';\\nimport { branchSafetyNeedsCorrectionRemediation } from '../src/branch-recovery-ui.js';\"\n)\ninsert ="
          replacement = "    \"import { manualRelationshipRemediationPatch } from '../src/ui.js';\\nimport { branchSafetyNeedsCorrectionRemediation } from '../src/branch-recovery-ui.js';\"\n)\nt = read(test_path)\ninsert ="
          if needle not in text:
              raise SystemExit('follow-up harness import anchor missing')
          path.write_text(text.replace(needle, replacement, 1))
          PY

      - name: Apply follow-up polish
        run: python3 scripts/apply-v073-followup.py

      - name: Validate authoritative source
        run: npm run validate

      - name: Run regression tests
        run: npm test

      - name: Package extension
        run: npm run package

      - name: Inspect package and diff
        run: |
          unzip -l dist/*.zip
          git diff --stat
          git diff --check

      - name: Commit verified follow-up
        run: |
          rm scripts/apply-v073-followup.py
          rm .github/workflows/v073-followup-verify.yml
          git config user.name "OpenAI automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: tighten correction remediation boundary"
          git push origin HEAD:automation/v073-correction-remediation
