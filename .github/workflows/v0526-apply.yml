name: Apply v0.5.26 POV target binding

on:
  push:
    branches:
      - fix/v0526-pov-target-binding

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/v0526-pov-target-binding
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Repair temporary helper quoting
        run: node tools/v0526-fix-helper.mjs
      - name: Apply source, tests, and release patch
        run: node tools/v0526-patch.mjs
      - name: Measure scanner prompts
        run: npm run measure:scan-prompts > /tmp/v0526-measure.txt
      - name: Record measured prompt matrix
        run: node tools/v0526-doc-metrics.mjs /tmp/v0526-measure.txt
      - name: Validate authoritative source
        run: npm run validate
      - name: Run regression tests
        run: npm test
      - name: Package extension
        run: npm run package
      - name: Re-run prompt measurement workflow
        run: npm run measure:scan-prompts
      - name: Commit verified candidate and remove helpers
        run: |
          rm -f .github/workflows/v0526-apply.yml tools/v0526-patch.mjs tools/v0526-doc-metrics.mjs tools/v0526-fix-helper.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "fix: support POV-independent relationship target binding"
            git push origin HEAD:fix/v0526-pov-target-binding
          fi
